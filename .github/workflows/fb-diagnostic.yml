name: fb-diagnostic
on: workflow_dispatch

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Firebase planner data
        run: |
          FB=https://synchroadmin-133f3-default-rtdb.asia-southeast1.firebasedatabase.app
          echo "===== bot_sessions (15 newest by date) ====="
          curl -s "$FB/bot_sessions.json" | jq 'to_entries | map({key:.key, date:.value.date, imported:.value.imported, venue:.value.venue_text, start:.value.start_time, end:.value.end_time, court:.value.court_no}) | sort_by(.date) | .[-15:]'
          echo "===== sessions ====="
          curl -s "$FB/sessions.json" | jq '(if type=="array" then map(select(.!=null)) else to_entries|map(.value) end) | {count:length, recent:(sort_by(.date // "")|.[-12:]|map({id,date,start_time,end_time,venue_text,bot_key,recurring}))}'
          echo "===== instances ====="
          curl -s "$FB/instances.json" | jq '(if type=="array" then map(select(.!=null)) else to_entries|map(.value) end) | {count:length, recent:(sort_by(.date // "")|.[-12:]|map({id,session_id,date,start_time,end_time,venue_text,status}))}'
          echo "===== bookings (bot-linked only) ====="
          curl -s "$FB/bookings.json" | jq 'to_entries | map(select(.value.bot_sessions_key != null)) | map({key:.key, bot_key:.value.bot_sessions_key, date:.value.date, venue:.value.venue}) | .[-10:]'
