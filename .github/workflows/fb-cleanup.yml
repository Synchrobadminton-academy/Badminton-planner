name: fb-cleanup
on: workflow_dispatch

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune orphan sessions and flag junk bot entries
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          FB = "https://synchroadmin-133f3-default-rtdb.asia-southeast1.firebasedatabase.app"
          SECRET = os.environ.get("FIREBASE_SECRET") or ""
          AUTH = f"?auth={SECRET}" if SECRET else ""

          def get(path):
              with urllib.request.urlopen(f"{FB}/{path}.json{AUTH}") as r:
                  return json.load(r)

          def put(path, value):
              req = urllib.request.Request(
                  f"{FB}/{path}.json{AUTH}", data=json.dumps(value).encode(),
                  method="PUT", headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req)

          def as_list(x):
              if not x: return []
              vals = x if isinstance(x, list) else list(x.values())
              return [v for v in vals if v]

          sessions = as_list(get("sessions"))
          instances = as_list(get("instances"))
          bookings = get("bookings") or {}

          used = {i.get("session_id") for i in instances}
          used |= {b.get("session_id") for b in bookings.values() if b}

          def keyed(records):
              # storage format: one record per "r<id>" key (see planner.html pushRecords)
              return {f"r{r['id']}": r for r in records if r.get("id") is not None}

          keep = [s for s in sessions if s.get("id") in used]
          removed = [s for s in sessions if s.get("id") not in used]
          print(f"sessions: {len(sessions)} total, keeping {len(keep)}, removing {len(removed)} orphans")
          print("removed sessions (for recovery if ever needed):")
          print(json.dumps(removed))
          put("sessions", keyed(keep))

          bs = get("bot_sessions") or {}
          for k, v in bs.items():
              if v and not v.get("imported") and (not v.get("date") or not v.get("start_time") or not v.get("end_time")):
                  put(f"bot_sessions/{k}/imported", True)
                  print(f"flagged junk bot entry {k} (date={v.get('date')}) as imported")

          # Backfill payment fields on bot-imported bookings created before
          # booker tracking existed (parse "Booked under/by NAME" from notes)
          import re
          from datetime import datetime, timezone
          PUSH_CHARS = "-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz"
          def key_date(key):
              try:
                  ts = 0
                  for c in key[:8]:
                      ts = ts * 64 + PUSH_CHARS.index(c)
                  if ts < 1e12: return None
                  return datetime.fromtimestamp(ts / 1000, tz=timezone.utc).strftime("%Y-%m-%d")
              except Exception:
                  return None
          def hours(t1, t2):
              try:
                  h1, m1 = map(int, t1.split(":")); h2, m2 = map(int, t2.split(":"))
                  return max(1, round(((h2 * 60 + m2) - (h1 * 60 + m1)) / 60))
              except Exception:
                  return 1
          for k, b in (bookings or {}).items():
              bk = b.get("bot_sessions_key") if b else None
              if not bk or b.get("booker"): continue
              src = bs.get(bk) or {}
              mt = re.search(r"booked\s+(?:under|by)[:\s]+([^.\n]+)", src.get("notes") or "", re.I)
              if not mt: continue
              fields = {
                  "booker": mt.group(1).strip(),
                  "payment_date": b.get("payment_date") or key_date(bk) or src.get("date"),
                  "venue_type": b.get("venue_type") or ("school" if re.search(r"school|primary|secondary", b.get("venue") or "", re.I) else "sports_hall"),
                  "slots": b.get("slots") or hours(src.get("start_time"), src.get("end_time")),
              }
              for fk, fv in fields.items():
                  put(f"bookings/{k}/{fk}", fv)
              print(f"backfilled booking {k}: booker={fields['booker']} slots={fields['slots']} type={fields['venue_type']}")

          # One-time: merge duplicate blocks (same date+time+venue) into one,
          # combining courts ("01 & 04"), coach lists and attendance rosters
          instances = as_list(get("instances"))
          sessions = as_list(get("sessions"))
          attendance = get("attendance") or {}
          groups = {}
          for i in instances:
              if not i or i.get("status") == "cancelled": continue
              k = (i.get("date"), i.get("start_time"), i.get("end_time"), (i.get("venue_text") or "").strip().lower())
              groups.setdefault(k, []).append(i)
          merged_any = False
          drop_inst_ids, drop_sess_ids = set(), set()
          for k, grp in groups.items():
              if len(grp) < 2: continue
              grp.sort(key=lambda x: x.get("id") or 0)
              keep = grp[0]
              courts, coaches = [], []
              roster, seen_names = [], set()
              for i in grp:
                  for c in str(i.get("court_no") or "").split("&"):
                      c = c.strip()
                      if c and c not in courts: courts.append(c)
                  for cid in (i.get("coach_ids") or []):
                      if cid not in coaches: coaches.append(cid)
                  for a in (attendance.get(str(i["id"])) or []):
                      if a and a.get("name") and a["name"].strip().lower() not in seen_names:
                          seen_names.add(a["name"].strip().lower())
                          roster.append(a)
              keep["court_no"] = " & ".join(courts)
              keep["coach_ids"] = coaches
              for i in grp[1:]:
                  drop_inst_ids.add(i["id"])
                  drop_sess_ids.add(i.get("session_id"))
              if roster:
                  fixed = [dict(a, id=n+1) for n, a in enumerate(roster)]
                  put(f"attendance/{keep['id']}", fixed)
              merged_any = True
              print(f"merged {len(grp)} blocks -> {keep['date']} {keep['start_time']} {k[3]} Court {keep['court_no']}")
          if merged_any:
              kept_sess_refs = {i.get("session_id") for i in instances if i and i["id"] not in drop_inst_ids}
              new_instances = [i for i in instances if i and i["id"] not in drop_inst_ids]
              new_sessions = [s for s in sessions if s and not (s["id"] in drop_sess_ids and s["id"] not in kept_sess_refs)]
              put("instances", keyed(new_instances))
              put("sessions", keyed(new_sessions))
              print(f"instances: {len(instances)} -> {len(new_instances)}; sessions: {len(sessions)} -> {len(new_sessions)}")
          else:
              print("no duplicate blocks to merge")

          print("done")
          EOF
