name: fb-audit
on:
  workflow_dispatch:
    inputs:
      month:
        description: month to audit (YYYY-MM)
        required: true
        default: "2026-08"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Compare site dues against the venue-type sheet model
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          MONTH: ${{ inputs.month }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request
          from datetime import date

          FB = "https://synchroadmin-133f3-default-rtdb.asia-southeast1.firebasedatabase.app"
          AUTH = "?auth=" + os.environ["FIREBASE_SECRET"] if os.environ.get("FIREBASE_SECRET") else ""
          MONTH = os.environ["MONTH"]

          def get(path):
              with urllib.request.urlopen(f"{FB}/{path}.json{AUTH}") as r:
                  return json.load(r)

          # --- site model (planner.html): rate depends on day/time ---
          SG_PH = {'2025-01-01','2025-01-29','2025-01-30','2025-04-18','2025-05-01','2025-05-12',
                   '2025-06-06','2025-08-09','2025-10-20','2025-12-25','2026-01-01','2026-02-17',
                   '2026-02-18','2026-04-03','2026-05-01','2026-05-31','2026-06-16','2026-08-09',
                   '2026-10-28','2026-12-25'}

          def start_hour(t):
              m = re.search(r'(\d{1,2})(?::(\d{2}))?\s*(am|pm)?', str(t or ''), re.I)
              if not m: return None
              h = int(m.group(1)); ap = (m.group(3) or '').lower()
              if ap == 'pm' and h != 12: h += 12
              elif ap == 'am' and h == 12: h = 0
              elif not ap and h < 8: h += 12
              return h

          def is_peak(d, t):
              if not d or len(d) != 10: return True, "no date"
              y, mo, dy = map(int, d.split("-"))
              if date(y, mo, dy).weekday() >= 5: return True, "weekend"
              if d in SG_PH: return True, "public holiday"
              h = start_hour(t)
              if h is None: return True, "bad time"
              return (h >= 18), (f"wkday {h}h peak" if h >= 18 else f"wkday {h}h off")

          def pay_date(b):
              return str(b.get("payment_date") or (b.get("created_at") or "")[:10] or b.get("date") or "")

          def court_date(b):
              return str(b.get("court_date") or b.get("date") or "")

          bookings = get("bookings") or {}
          rows = []
          for k, b in bookings.items():
              if not b: continue
              if not (b.get("booker") or b.get("source") != "activesg"): continue
              cd, pd = court_date(b), pay_date(b)
              slots = b.get("slots") or 1
              school = b.get("venue_type") == "school"
              peak, why = is_peak(cd, b.get("time"))
              site = ((7.40 if peak else 3.50) + (5.00 if school else 2.50)) * slots
              # sheet model: school = 12.40/slot ("Special"), sports hall = 6.00/slot ("off peak")
              sheet = (12.40 if school else 6.00) * slots
              rows.append(dict(key=k, booker=str(b.get("booker") or "(none)"), pay=pd, court=cd,
                               venue=str(b.get("venue") or ""), ct=str(b.get("court") or ""),
                               time=str(b.get("time") or ""), slots=slots,
                               vt=("School" if school else "S.Hall"), peak=peak, why=why,
                               site=site, sheet=sheet))

          def show(title, sel, keyfn):
              print(f"\n===== {title} =====")
              tot_site, tot_sheet = {}, {}
              for r in sorted(sel, key=lambda r: (r["booker"], r[keyfn])):
                  tot_site[r["booker"]] = tot_site.get(r["booker"], 0) + r["site"]
                  tot_sheet[r["booker"]] = tot_sheet.get(r["booker"], 0) + r["sheet"]
                  flag = "   <-- DIFFERS" if abs(r["site"] - r["sheet"]) > 0.005 else ""
                  print(f'  {r["booker"]:<10} pay {r["pay"]} court {r["court"]} {r["time"]:<12}'
                        f'{r["venue"][:26]:<27}Ct {r["ct"]:<8} x{r["slots"]} {r["vt"]:<7}'
                        f'{"PEAK" if r["peak"] else "off ":<5}({r["why"]:<13}) '
                        f'site ${r["site"]:>6.2f}  sheet ${r["sheet"]:>6.2f}{flag}')
              print("  --- totals: booker / site / sheet / gap ---")
              for n in sorted(tot_site, key=lambda n: -tot_site[n]):
                  print(f'  {n:<10} site ${tot_site[n]:>7.2f}   sheet ${tot_sheet.get(n,0):>7.2f}'
                        f'   gap ${tot_sheet.get(n,0)-tot_site[n]:>7.2f}')

          show(f"BY PAYMENT MONTH {MONTH} (the website's cards)",
               [r for r in rows if r["pay"][:7] == MONTH], "pay")
          show(f"BY COURT MONTH {MONTH} (a court-date sheet)",
               [r for r in rows if r["court"][:7] == MONTH], "court")

          print(f"\n===== STRADDLERS (paid in {MONTH} but played outside, or vice versa) =====")
          n = 0
          for r in sorted(rows, key=lambda r: r["pay"]):
              if (r["pay"][:7] == MONTH) != (r["court"][:7] == MONTH):
                  n += 1
                  print(f'  {r["booker"]:<10} pay {r["pay"]} court {r["court"]} '
                        f'{r["venue"][:26]:<27}x{r["slots"]} site ${r["site"]:.2f} sheet ${r["sheet"]:.2f}')
          if not n: print("  (none)")
          EOF
