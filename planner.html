<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏸 Coach Manpower Planner</title>
<style>
:root{
  --bg:#f1f5f9;--surf:#fff;--surf2:#f8fafc;--bdr:#e2e8f0;
  --tx:#0f172a;--txm:#475569;--txf:#94a3b8;--hov:#e8edf3;
  --blue:#2563eb;--bluebg:#eff6ff;--green:#16a34a;--red:#dc2626;
  --slot:34px;
}
[data-dark]{
  --bg:#0f172a;--surf:#1e293b;--surf2:#0f172a;--bdr:#334155;
  --tx:#f1f5f9;--txm:#94a3b8;--txf:#334155;--hov:#334155;
  --blue:#60a5fa;--bluebg:#1e3058;--green:#4ade80;--red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:13px;line-height:1.4;-webkit-tap-highlight-color:transparent}
nav{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 12px;display:flex;align-items:center;height:50px;gap:6px;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.brand{font-weight:800;color:var(--blue);white-space:nowrap;font-size:14px;margin-right:4px}
.nav-link{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--txm);cursor:pointer;border:none;background:none}
.nav-link:hover{background:var(--hov);color:var(--tx)}
.nav-link.active{background:var(--blue);color:#fff}
.ml{margin-left:auto}
.theme-btn{padding:5px 8px;border-radius:6px;border:1px solid var(--bdr);background:var(--surf);cursor:pointer;font-size:15px;line-height:1}
main{max-width:1300px;margin:0 auto;padding:14px}
.view{display:none}.view.active{display:block}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:14px}
.card-body{padding:16px}
.card-hdr{padding:11px 16px;border-bottom:1px solid var(--bdr);font-weight:700;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 13px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{opacity:.88}
.btn-o{background:var(--surf);color:var(--txm);border-color:var(--bdr)}.btn-o:hover{background:var(--hov)}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-red{color:var(--red);border-color:var(--red);background:transparent}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--txm);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=time],input[type=color],select.fc{width:100%;border:1px solid var(--bdr);border-radius:6px;padding:6px 9px;font-size:13px;outline:none;font-family:inherit;background:var(--surf);color:var(--tx)}
input:focus,select.fc:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
input[type=color]{padding:2px 4px;height:34px;cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk-row{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:2px 0}
.chk-row input{width:auto}
/* sched controls */
.sub-tog{display:inline-flex;border:1px solid var(--bdr);border-radius:7px;overflow:hidden;margin-bottom:12px}
.sub-tog button{padding:4px 14px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:var(--surf);color:var(--txm)}
.sub-tog button.active{background:var(--blue);color:#fff}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ctrl-lbl{font-weight:700;font-size:13px}
.legend-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.lchip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid rgba(0,0,0,.2)}
/* weekly grid */
.sched-outer{overflow-x:auto;border:1px solid var(--bdr);border-radius:10px;background:var(--surf);user-select:none}
table.sched{border-collapse:collapse;min-width:740px;width:100%;font-size:11px}
table.sched th{background:var(--surf2);padding:5px 3px;text-align:center;font-weight:700;color:var(--txm);border:1px solid var(--bdr);white-space:nowrap;min-width:110px}
table.sched th.today-h{background:var(--bluebg);color:var(--blue)}
table.sched th.corner{width:52px;min-width:52px;position:sticky;left:0;z-index:20}
table.sched td.ttime{width:52px;text-align:right;padding:0 5px;color:var(--txf);background:var(--surf2);border:1px solid var(--bdr);white-space:nowrap;position:sticky;left:0;z-index:10;height:var(--slot);font-size:10px;vertical-align:middle}
table.sched td.tslot{border:1px solid var(--bdr);padding:0;vertical-align:top;position:relative;height:var(--slot);cursor:crosshair}
table.sched td.tslot.half{border-top-style:dashed}
table.sched td.tslot.drag-hi{background:rgba(37,99,235,.13)}
/* session block */
.sblock{position:absolute;border-radius:4px;padding:3px 5px;overflow:hidden;font-size:10.5px;line-height:1.3;border:1px solid rgba(0,0,0,.25);box-shadow:0 1px 4px rgba(0,0,0,.18);z-index:10;top:0}
.sblock.cancelled{opacity:.38;text-decoration:line-through}
.sblock.completed{opacity:.72}
.sb-venue{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-row{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.92}
.sb-coach{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.sb-time{font-size:9.5px;opacity:.82}
.sb-btns{display:flex;gap:2px;margin-top:2px;flex-wrap:wrap}
.sb-btns button{background:rgba(0,0,0,.18);border:none;cursor:pointer;padding:1px 4px;font-size:10px;border-radius:3px;line-height:1.4;font-weight:700}
.sb-btns button:hover{background:rgba(0,0,0,.32)}
/* clipboard bar */
#clip-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:24px;font-size:12px;font-weight:600;display:none;align-items:center;gap:10px;z-index:400;box-shadow:0 4px 20px rgba(0,0,0,.3);white-space:nowrap}
#clip-bar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:2px 10px;border-radius:12px;cursor:pointer;font-size:11px}
/* monthly */
.cal-wrap{border:1px solid var(--bdr);border-radius:10px;overflow:hidden;background:var(--surf)}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--bdr)}
.cal-dow{text-align:center;padding:6px 3px;font-size:11px;font-weight:800;color:var(--txm);background:var(--surf2);text-transform:uppercase;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:150px;max-height:220px;overflow-y:auto;border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr);padding:4px;cursor:pointer;transition:background .1s}
.cal-cell:hover{background:var(--hov)}
.cal-cell.other{opacity:.28;cursor:default}
.cal-cell.today .cal-num{background:var(--blue);color:#fff;border-radius:50%}
.cal-num{font-size:11px;font-weight:800;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:3px}
.cal-chip{font-size:10px;padding:2px 5px;border-radius:3px;border:1px solid rgba(0,0,0,.18);margin-bottom:2px;line-height:1.35}
.cal-chip-venue{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip-sub{opacity:.88;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* coaches table */
.dtable{width:100%;border-collapse:collapse;font-size:12px}
.dtable th{text-align:left;padding:9px 14px;background:var(--surf2);border-bottom:1px solid var(--bdr);font-weight:700;color:var(--txm);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.dtable td{padding:9px 14px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.dtable tr:last-child td{border-bottom:none}
.dtable tbody tr:hover td{background:var(--hov)}
.badge{display:inline-flex;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;border:1px solid;cursor:pointer}
.b-g{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.b-gr{background:var(--surf2);color:var(--txm);border-color:var(--bdr)}
[data-dark] .b-g{background:#14532d;color:#4ade80;border-color:#166534}
/* tracker */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{border:3px solid;border-radius:10px;padding:14px;text-align:center}
.tc-name{font-weight:800;font-size:13px;margin-bottom:6px}
.tc-hrs{font-size:28px;font-weight:900;line-height:1}
.tc-lbl{font-size:10px;color:var(--txm);margin-top:3px}
.tc-sub{font-size:10px;color:var(--txm);margin-top:4px}
/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.modal{background:var(--surf);border-radius:12px;padding:20px;width:100%;max-width:430px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:93vh;overflow-y:auto}
.modal h2{font-size:14px;font-weight:800;margin-bottom:14px}
.mact{display:flex;gap:8px;margin-top:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
/* coach checkboxes */
.cchk-wrap{display:flex;flex-wrap:wrap;gap:5px}
.cchk{display:flex;align-items:center;gap:4px;border:1px solid var(--bdr);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;font-weight:700;background:var(--surf2)}
.cchk input{width:auto;cursor:pointer;accent-color:var(--blue)}
.cchk.on{border-color:var(--blue);background:var(--bluebg)}
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.page-title{font-size:16px;font-weight:800}
.empty{text-align:center;padding:28px;color:var(--txf);font-size:12px}
/* day modal sessions */
.day-item{border-left:4px solid;border-radius:6px;padding:9px 12px;margin-bottom:8px;background:var(--surf2)}
@media(max-width:640px){.two-col{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
  <span class="brand">🏸 Coach Planner</span>
  <button class="nav-link active" id="nav-schedule" onclick="showView('schedule')">Schedule</button>
  <button class="nav-link" id="nav-coaches" onclick="showView('coaches')">Coaches</button>
  <button class="nav-link" id="nav-tracker" onclick="showView('tracker')">Tracker</button>
  <button class="theme-btn ml" id="theme-btn" onclick="toggleTheme()">🌙</button>
</nav>

<main>

<!-- SCHEDULE -->
<div class="view active" id="view-schedule">
  <div class="sub-tog">
    <button id="tog-w" class="active" onclick="switchSched('week')">Week</button>
    <button id="tog-m" onclick="switchSched('month')">Month</button>
  </div>

  <div id="sv-week">
    <div class="ctrl-row">
      <button class="btn btn-o btn-sm" onclick="shiftWeek(-1)">◀ Prev</button>
      <span class="ctrl-lbl" id="week-lbl"></span>
      <button class="btn btn-o btn-sm" onclick="shiftWeek(1)">Next ▶</button>
      <button class="btn btn-o btn-sm" onclick="baseDate=new Date();renderWeek()" style="color:var(--blue)">Today</button>
      <span style="font-size:11px;color:var(--txf)">· Drag to select time range</span>
    </div>
    <div id="legend-w" class="legend-wrap"></div>
    <div class="sched-outer">
      <table class="sched">
        <thead id="sched-head"></thead>
        <tbody id="sched-body"></tbody>
      </table>
    </div>
  </div>

  <div id="sv-month" style="display:none">
    <div class="ctrl-row">
      <button class="btn btn-o btn-sm" onclick="shiftMonth(-1)">◀ Prev</button>
      <span class="ctrl-lbl" id="month-lbl"></span>
      <button class="btn btn-o btn-sm" onclick="shiftMonth(1)">Next ▶</button>
      <button class="btn btn-o btn-sm" onclick="calDate=new Date();renderMonth()" style="color:var(--blue)">Today</button>
    </div>
    <div id="legend-m" class="legend-wrap"></div>
    <div class="cal-wrap">
      <div class="cal-dow-row" id="cal-dows"></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</div>

<!-- COACHES -->
<div class="view" id="view-coaches">
  <div class="page-hdr"><h1 class="page-title">Coaches</h1></div>
  <div class="two-col">
    <div>
      <div class="card">
        <div class="card-hdr" id="coach-form-hdr">Add Coach</div>
        <div class="card-body">
          <form id="coach-form" onsubmit="submitCoach(event)">
            <div class="form-row">
              <div class="fg" style="margin:0"><label>Name *</label><input type="text" id="cn" required placeholder="Coach name"></div>
              <div class="fg" style="margin:0"><label>Block Color</label><input type="color" id="ccolor" value="#22c55e"></div>
            </div>
            <div class="fg"><label>Contact</label><input type="text" id="ccontact" placeholder="Phone or email"></div>
            <div class="fg"><label class="chk-row"><input type="checkbox" id="cactive" checked> Active</label></div>
            <div style="display:flex;gap:8px">
              <button type="submit" class="btn btn-p">Save</button>
              <button type="button" class="btn btn-o" id="coach-cancel" style="display:none" onclick="cancelCoachEdit()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr">Venues (for suggestions)</div>
        <div class="card-body" style="padding-top:10px">
          <div id="venues-list" style="margin-bottom:10px"></div>
          <form id="venue-form" onsubmit="addVenue(event)" style="display:flex;gap:8px">
            <input type="text" id="vn" placeholder="Venue name" required style="flex:1">
            <button type="submit" class="btn btn-o btn-sm">Add</button>
          </form>
        </div>
      </div>
    </div>
    <div class="card"><div id="coaches-list"></div></div>
  </div>
</div>

<!-- TRACKER -->
<div class="view" id="view-tracker">
  <div class="page-hdr">
    <h1 class="page-title">Monthly Tracker</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:12px;color:var(--txm)">Month:</label>
      <select id="tracker-month" class="fc" style="width:auto" onchange="trackerMonth=this.value;renderTracker()"></select>
    </div>
  </div>
  <div id="tracker-content"></div>
</div>

</main>

<!-- SESSION MODAL -->
<div class="overlay" id="sess-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="sess-ttl">Add Session</h2>
    <div class="fg"><label>Coaches</label><div id="cchk-wrap" class="cchk-wrap"></div></div>
    <div class="fg"><label>Block Color</label><input type="color" id="m-color" value="#22c55e"></div>
    <div class="fg">
      <label>Venue</label>
      <input type="text" id="m-venue" list="vsugg" placeholder="e.g. Bukit Canberra SH">
      <datalist id="vsugg"></datalist>
    </div>
    <div class="form-row">
      <div class="fg" style="margin:0">
        <label>Class</label>
        <input type="text" id="m-class" list="clsugg" placeholder="e.g. ActiveSG">
        <datalist id="clsugg"><option>ActiveSG</option><option>Synchro</option><option>Rise &amp; Rally Adult</option><option>Private Group</option></datalist>
      </div>
      <div class="fg" style="margin:0">
        <label>Standard</label>
        <input type="text" id="m-std" list="stsugg" placeholder="e.g. Advance">
        <datalist id="stsugg"><option>Basic</option><option>Advance</option><option>Mix</option><option>Adult</option><option>All</option></datalist>
      </div>
    </div>
    <div class="fg"><label>Court No (free text)</label><input type="text" id="m-court" placeholder="e.g. 5 &amp; 6, Court 1 &amp; 2"></div>
    <div class="form-row">
      <div class="fg" style="margin:0"><label>Start</label><input type="time" id="m-start" step="1800" required></div>
      <div class="fg" style="margin:0"><label>End</label><input type="time" id="m-end" step="1800" required></div>
    </div>
    <div class="fg"><label>Notes (optional)</label><input type="text" id="m-notes" placeholder="e.g. *Spare*, 1 Hour only"></div>
    <div class="fg"><label class="chk-row"><input type="checkbox" id="m-rec"> <span id="m-rec-lbl">Recurring weekly</span></label></div>
    <div class="mact">
      <button class="btn btn-p" style="flex:1" onclick="submitSession()">Save</button>
      <button class="btn btn-o" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- DAY DETAIL MODAL -->
<div class="overlay" id="day-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <h2 id="day-ttl"></h2>
    <div id="day-body"></div>
    <div class="mact">
      <button class="btn btn-p" style="flex:1" onclick="openAddFromDay()">+ Add Session</button>
      <button class="btn btn-o" onclick="document.getElementById('day-modal').classList.remove('open')">Close</button>
    </div>
  </div>
</div>

<!-- CLIPBOARD BAR -->
<div id="clip-bar">📋 Session copied — drag any slot to paste &nbsp;<button onclick="clearClip()">Clear</button></div>

<script>
// ── THEME ─────────────────────────────────────────────────────
(function(){
  if(localStorage.getItem('cmp_theme')==='dark'){
    document.documentElement.setAttribute('data-dark','');
    document.getElementById('theme-btn').textContent='☀️';
  }
})();
function toggleTheme(){
  const on=document.documentElement.hasAttribute('data-dark');
  if(on){document.documentElement.removeAttribute('data-dark');document.getElementById('theme-btn').textContent='🌙';localStorage.setItem('cmp_theme','light')}
  else{document.documentElement.setAttribute('data-dark','');document.getElementById('theme-btn').textContent='☀️';localStorage.setItem('cmp_theme','dark')}
}

// ── STORAGE ───────────────────────────────────────────────────
const S={
  get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))},
  nextId(a){return a.length?Math.max(...a.map(i=>i.id))+1:1}
};
(function init(){
  if(localStorage.getItem('cmp_v3'))return;
  S.set('coaches',[]);
  S.set('venues',['Bukit Canberra SH','Bishan Clubhouse','Woodland SH','Sembawang Pri','Yishun SH','Arena Sport Hall']);
  S.set('sessions',[]);
  S.set('instances',[]);
  localStorage.setItem('cmp_v3','1');
})();

const getCoaches=()=>S.get('coaches');
const getVenues=()=>S.get('venues'); // string[]
const getInsts=()=>S.get('instances');

function saveCoach(c){
  const l=getCoaches();
  if(c.id){const i=l.findIndex(x=>x.id===c.id);if(i>=0)l[i]=c;}
  else{c={...c,id:S.nextId(l)};l.push(c);}
  S.set('coaches',l);return c;
}
function saveSession(s){
  const l=S.get('sessions');
  s={...s,id:S.nextId(l)};l.push(s);S.set('sessions',l);return s;
}
function setInstStatus(id,st){
  const l=getInsts(),i=l.findIndex(x=>x.id===id);
  if(i>=0)l[i].status=st;S.set('instances',l);
}
function delInst(id){S.set('instances',getInsts().filter(i=>i.id!==id))}
function updateInst(id,data){
  const l=getInsts(),i=l.findIndex(x=>x.id===id);
  if(i>=0)l[i]={...l[i],...data,hours:compHrs(data.start_time,data.end_time)};
  S.set('instances',l);
}

// ── HELPERS ───────────────────────────────────────────────────
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function t2d(t){const[h,m]=t.split(':').map(Number);return h+m/60}
function d2t(d){return`${String(Math.floor(d)).padStart(2,'0')}:${d%1>=.5?'30':'00'}`}
function ds(d){return d.toISOString().split('T')[0]}
function fmt12(t){if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';const h12=h%12||12;return m?`${h12}:${String(m).padStart(2,'0')}${ap}`:`${h12}${ap}`}
function compHrs(s,e){const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);return(eh*60+em-sh*60-sm)/60}
function txColor(hex){if(!hex||hex.length<7)return'#000';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(0.299*r+0.587*g+0.114*b)/255>0.55?'#000':'#fff'}
function coachNames(ids){const coaches=getCoaches();return(ids||[]).map(id=>coaches.find(c=>c.id===id)?.name||'').filter(Boolean).join(' & ')}

function genRec(sid,data,dow){
  const l=getInsts(),today=new Date();today.setHours(0,0,0,0);
  const diff=(dow-today.getDay()+7)%7;
  const first=new Date(today);first.setDate(today.getDate()+diff);
  const hrs=compHrs(data.start_time,data.end_time);
  for(let w=0;w<12;w++){
    const d=new Date(first);d.setDate(first.getDate()+w*7);
    const dt=ds(d);
    if(!l.find(i=>i.session_id===sid&&i.date===dt))
      l.push({id:S.nextId(l),session_id:sid,...data,date:dt,status:'scheduled',hours:hrs});
  }
  S.set('instances',l);
}

  const l=getInsts();
  l.push({id:S.nextId(l),session_id:sid,...data,date,status:'scheduled',hours:compHrs(data.start_time,data.end_time)});

// ── CONCURRENT LAYOUT ─────────────────────────────────────────
function layoutInsts(insts){
  const sorted=[...insts].sort((a,b)=>t2d(a.start_time)-t2d(b.start_time));
  const colEnds=[];
  const result=sorted.map(inst=>{
    const s=t2d(inst.start_time),e=t2d(inst.end_time);
    let col=colEnds.findIndex(et=>et<=s);
    if(col===-1){col=colEnds.length;colEnds.push(0);}
    colEnds[col]=e;
    return{...inst,_col:col};
  });
  const total=colEnds.length||1;
  return result.map(r=>({...r,_tot:total}));
}

// ── WEEKLY VIEW ───────────────────────────────────────────────
let baseDate=new Date();
const SLOT_H=34;

function getWk(b){
  const d=new Date(b),day=d.getDay();
  const mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{const dd=new Date(mon);dd.setDate(mon.getDate()+i);return dd});
}
function shiftWeek(n){baseDate=new Date(baseDate);baseDate.setDate(baseDate.getDate()+n*7);renderWeek()}

function renderWeek(){
  renderLegend('legend-w');
  const wk=getWk(baseDate);
  const today=ds(new Date());
  document.getElementById('week-lbl').textContent=`${ds(wk[0])} — ${ds(wk[6])}`;
  // Header
  let head=`<tr><th class="corner"></th>`;
  wk.forEach(d=>{
    const it=ds(d)===today;
    head+=`<th class="${it?'today-h':''}" style="min-width:110px"><div>${DAYS[d.getDay()]}</div><div style="font-size:16px${it?';font-weight:900':''}">${d.getDate()}</div></th>`;
  });
  document.getElementById('sched-head').innerHTML=head+'</tr>';
  // Build empty rows
  const slots=[];for(let h=6;h<22;h++){slots.push(h);slots.push(h+.5)}
  let body='';
  slots.forEach(h=>{
    const half=h%1!==0;
    body+=`<tr><td class="ttime">${half?'':fmt12(d2t(h))}</td>`;
    wk.forEach(d=>{
      body+=`<td class="tslot${half?' half':''}" data-date="${ds(d)}" data-day="${d.getDay()}" data-h="${h}"></td>`;
    });
    body+='</tr>';
  });
  document.getElementById('sched-body').innerHTML=body;
  // Inject session blocks
  const allI=getInsts();
  const wkI=allI.filter(i=>i.date>=ds(wk[0])&&i.date<=ds(wk[6]));
  wk.forEach((d,di)=>{
    const dt=ds(d);
    const dayI=wkI.filter(i=>i.date===dt);
    const laid=layoutInsts(dayI);
    laid.forEach(inst=>{
      const startSlot=(t2d(inst.start_time)-6)*2;
      const endSlot=(t2d(inst.end_time)-6)*2;
      if(startSlot<0||startSlot>=32)return;
      const rowIdx=Math.floor(startSlot);
      const rows=document.querySelectorAll('#sched-body tr');
      const row=rows[rowIdx];if(!row)return;
      const cells=row.querySelectorAll('td.tslot');
      const td=cells[di];if(!td)return;
      td.style.position='relative';
      const hpx=(endSlot-startSlot)*SLOT_H-2;
      const lp=inst._col/inst._tot*100;
      const wp=100/inst._tot;
      const color=inst.color||'#3b82f6';
      const tc=txColor(color);
      const sc=inst.status==='cancelled'?'cancelled':inst.status==='completed'?'completed':'';
      const si=inst.status==='completed'?'✅':inst.status==='cancelled'?'❌':'⬜';
      const cn=coachNames(inst.coach_ids);
      const div=document.createElement('div');
      div.className=`sblock ${sc}`;
      div.style.cssText=`background:${color};color:${tc};left:calc(${lp}% + 1px);width:calc(${wp}% - 2px);height:${hpx}px`;
      div.innerHTML=`
        ${inst.venue_text?`<div class="sb-venue">${esc(inst.venue_text)}</div>`:''}
        ${inst.class_type||inst.standard?`<div class="sb-row">${esc([inst.class_type,inst.standard].filter(Boolean).join(' · '))}</div>`:''}
        ${inst.court_no?`<div class="sb-row">Ct: ${esc(inst.court_no)}</div>`:''}
        <div class="sb-time">${fmt12(inst.start_time)} – ${fmt12(inst.end_time)}</div>
        ${inst.notes?`<div class="sb-row" style="font-style:italic">${esc(inst.notes)}</div>`:''}
        ${cn?`<div class="sb-coach">${esc(cn)}</div>`:''}
        <div class="sb-btns">
          <button onclick="event.stopPropagation();cycleW(${inst.id})" title="Status">${si}</button>
          <button onclick="event.stopPropagation();copyInst(${inst.id})" title="Copy">📋</button>
          <button onclick="event.stopPropagation();openEdit(${inst.id})" title="Edit">✎</button>
          <button onclick="event.stopPropagation();if(confirm('Delete?')){delInst(${inst.id});renderWeek()}" title="Delete" style="opacity:.7">✕</button>
        </div>`;
      td.appendChild(div);
    });
  });
  setupDrag();
}

function cycleW(id){
  const i=getInsts().find(x=>x.id===id);if(!i)return;
  const n=i.status==='scheduled'?'completed':i.status==='completed'?'cancelled':'scheduled';
  setInstStatus(id,n);renderWeek();

// ── DRAG SELECT ───────────────────────────────────────────────
let drag=null;
function setupDrag(){
  const tbody=document.getElementById('sched-body');
  tbody.onmousedown=e=>{
    const td=e.target.closest('td.tslot');if(!td)return;
    e.preventDefault();
    drag={date:td.dataset.date,day:+td.dataset.day,s:+td.dataset.h,e:+td.dataset.h};
    highlight();
    document.onmousemove=ev=>{
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      const t=el?.closest('td.tslot');
      if(t&&t.dataset.date===drag.date){drag.e=+t.dataset.h;highlight();}
    };
    document.onmouseup=()=>{
      document.onmousemove=null;document.onmouseup=null;
      clearHL();
      if(drag){openModal(drag.date,drag.day,Math.min(drag.s,drag.e),Math.max(drag.s,drag.e)+.5);drag=null;}
    };
  };
  // Touch
  tbody.ontouchstart=e=>{
    const td=e.target.closest('td.tslot');if(!td)return;
    drag={date:td.dataset.date,day:+td.dataset.day,s:+td.dataset.h,e:+td.dataset.h};
    const onMove=ev=>{
      const t=document.elementFromPoint(ev.touches[0].clientX,ev.touches[0].clientY)?.closest('td.tslot');
      if(t&&t.dataset.date===drag.date){drag.e=+t.dataset.h;}
    };
    const onEnd=()=>{
      document.removeEventListener('touchmove',onMove);
      if(drag){openModal(drag.date,drag.day,Math.min(drag.s,drag.e),Math.max(drag.s,drag.e)+.5);drag=null;}
    };
    document.addEventListener('touchmove',onMove,{passive:true});
    document.addEventListener('touchend',onEnd,{once:true});
  };
}
function highlight(){
  clearHL();
  if(!drag)return;
  const lo=Math.min(drag.s,drag.e),hi=Math.max(drag.s,drag.e);
  document.querySelectorAll(`td.tslot[data-date="${drag.date}"]`).forEach(td=>{
    const h=+td.dataset.h;if(h>=lo&&h<=hi)td.classList.add('drag-hi');
  });
}
function clearHL(){document.querySelectorAll('td.tslot.drag-hi').forEach(x=>x.classList.remove('drag-hi'))}

  const coach_ids=Array.from(document.querySelectorAll('#cchk-wrap input:checked')).map(x=>+x.value);
  const color=document.getElementById('m-color').value;
  const venue_text=document.getElementById('m-venue').value.trim();

  const standard=document.getElementById('m-std').value.trim();

  const notes=document.getElementById('m-notes').value.trim();

  const end_time=document.getElementById('m-end').value;
  const rec=document.getElementById('m-rec').checked;
  if(!start_time||!end_time){alert('Set start and end time.');return}
  if(start_time>=end_time){alert('End must be after start.');return}

    sel.innerHTML=Array.from({length:15},(_,i)=>{
      const d=new Date();d.setMonth(d.getMonth()-12+i);
      const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      return`<option value="${ym}">${mLabel(ym)}</option>`;
    }).join('');
  }
  sel.value=trackerMonth;
  const coaches=getCoaches();
  const mI=getInsts().filter(i=>i.date.startsWith(trackerMonth));
  const cards=coaches.map(c=>{
    const ci=mI.filter(i=>i.coach_ids&&i.coach_ids.includes(c.id));
    const active=ci.filter(i=>i.status!=='cancelled');
    const hrs=active.reduce((a,i)=>a+i.hours,0);
    return{c,hrs,total:ci.length,done:ci.filter(i=>i.status==='completed').length};
  }).filter(x=>x.total>0);
  if(!cards.length){
    document.getElementById('tracker-content').innerHTML=`<div class="card"><div class="empty">No sessions for ${mLabel(trackerMonth)}.</div></div>`;
    return;
  }
  document.getElementById('tracker-content').innerHTML=`
    <p style="font-size:12px;color:var(--txm);margin-bottom:12px">${mLabel(trackerMonth)}</p>
    <div class="tgrid">
      ${cards.map(x=>{
        const color=x.c.color||'#3b82f6';
        return`<div class="tcard" style="border-color:${color};background:${color}18">
          <div class="tc-name" style="color:${color}">${esc(x.c.name)}</div>
          <div class="tc-hrs">${x.hrs.toFixed(1)}</div>
          <div class="tc-lbl">hours</div>
          <div class="tc-sub">${x.total} session${x.total!==1?'s':''} · ${x.done} done</div>
        </div>`;
      }).join('')}
    </div>`;
}

// ── BOOT ─────────────────────────────────────────────────────
showView('schedule');
</script>
</body>
</html>
