<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏸 Coach Manpower Planner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;font-size:14px;line-height:1.5}
nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:0 16px;display:flex;align-items:center;height:52px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.brand{font-weight:700;color:#1d4ed8;white-space:nowrap;font-size:15px}
.nav-links{display:flex;gap:3px}
.nav-link{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;color:#475569;cursor:pointer;border:none;background:none}
.nav-link:hover{background:#f1f5f9}
.nav-link.active{background:#2563eb;color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px 16px}
.view{display:none}
.view.active{display:block}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-body{padding:20px}
.card-header{padding:14px 20px;border-bottom:1px solid #f1f5f9;font-weight:600;font-size:14px;color:#334155}
.btn{display:inline-flex;align-items:center;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:500;border:1px solid transparent;cursor:pointer}
.btn-primary{background:#2563eb;color:#fff;border-color:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn-outline{background:#fff;color:#475569;border-color:#e2e8f0}
.btn-outline:hover{background:#f8fafc}
.btn-sm{padding:4px 10px;font-size:12px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:500;color:#64748b;margin-bottom:4px}
input[type=text],input[type=number],input[type=time],select.fc{width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:7px 10px;font-size:14px;outline:none;font-family:inherit}
input:focus,select.fc:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(147,197,253,.3)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Schedule */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.week-label{font-weight:600;color:#334155}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.lchip{display:inline-flex;align-items:center;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid}
.sched-wrap{overflow-x:auto;border:1px solid #e2e8f0;border-radius:10px;background:#fff}
table.sched{border-collapse:collapse;min-width:680px;width:100%;font-size:12px}
table.sched th{background:#f8fafc;padding:6px 4px;text-align:center;font-weight:500;color:#64748b;border:1px solid #e2e8f0;white-space:nowrap;min-width:90px}
table.sched th.tcorner{position:sticky;left:0;z-index:20;min-width:52px}
table.sched th.today-h{background:#eff6ff;color:#1d4ed8}
table.sched td.ttime{width:52px;text-align:right;padding:0 6px;color:#94a3b8;background:#f8fafc;border:1px solid #e2e8f0;white-space:nowrap;position:sticky;left:0;z-index:10}
table.sched td.tslot{height:28px;position:relative;border:1px solid #e2e8f0;padding:0;vertical-align:top;cursor:default}
table.sched td.tslot.half{border-top-style:dashed}
table.sched td.tslot.empty:hover{background:#eff6ff;cursor:pointer}
.sblock{position:absolute;left:1px;right:1px;top:0;border-radius:4px;border:1px solid;padding:2px 3px;overflow:hidden;z-index:5;font-size:11px;line-height:1.3;pointer-events:none}
.sblock>*{pointer-events:auto}
.sn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sa{display:flex;gap:2px;margin-top:1px}
.sa button{background:none;border:none;cursor:pointer;padding:0;font-size:11px;line-height:1;opacity:.8}
.sa button:hover{opacity:1}
.sblock.cancelled{opacity:.35;text-decoration:line-through}
.sblock.completed{opacity:.7}
.cc0{background:#dbeafe;border-color:#93c5fd;color:#1e40af}
.cc1{background:#dcfce7;border-color:#86efac;color:#166534}
.cc2{background:#f3e8ff;border-color:#c4b5fd;color:#6b21a8}
.cc3{background:#ffedd5;border-color:#fdba74;color:#9a3412}
.cc4{background:#fce7f3;border-color:#f9a8d4;color:#9d174d}
.cc5{background:#ccfbf1;border-color:#5eead4;color:#134e4a}
.cc6{background:#fef9c3;border-color:#fde047;color:#713f12}
/* Tables */
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{text-align:left;padding:10px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-weight:500;color:#64748b;font-size:12px}
.dtable td{padding:10px 16px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.dtable tr:last-child td{border-bottom:none}
.dtable tbody tr:hover td{background:#fafafa}
/* Badges */
.badge{display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid}
.bg{background:#f0fdf4;color:#16a34a;border-color:#bbf7d0}
.bgr{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
.bb{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.br{background:#fef2f2;color:#dc2626;border-color:#fecaca}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px}
.stat-val{font-size:22px;font-weight:700}
.stat-lbl{font-size:11px;color:#94a3b8;margin-top:2px}
/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:15px;font-weight:600;margin-bottom:16px}
.mactions{display:flex;gap:8px;margin-top:16px}
/* Misc */
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.page-title{font-size:18px;font-weight:700;color:#0f172a}
.empty{text-align:center;padding:32px;color:#94a3b8;font-size:13px}
.chk-row{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.expand-row{background:#f8fafc}
.expand-inner{padding:12px 20px}
.status-sel{border:1px solid;border-radius:6px;padding:2px 6px;font-size:11px;cursor:pointer;font-family:inherit}
@media(max-width:600px){.form-row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<nav>
  <span class="brand">🏸 Coach Planner</span>
  <div class="nav-links">
    <button class="nav-link active" id="nav-schedule" onclick="showView('schedule')">Schedule</button>
    <button class="nav-link" id="nav-coaches" onclick="showView('coaches')">Coaches</button>
    <button class="nav-link" id="nav-tracker" onclick="showView('tracker')">Tracker</button>
  </div>
</nav>

<main>

<!-- SCHEDULE VIEW -->
<div class="view active" id="view-schedule">
  <div class="week-nav">
    <button class="btn btn-outline btn-sm" onclick="shiftWeek(-1)">← Prev</button>
    <span class="week-label" id="week-label"></span>
    <button class="btn btn-outline btn-sm" onclick="shiftWeek(1)">Next →</button>
    <button class="btn btn-outline btn-sm" onclick="goToday()" style="color:#2563eb">Today</button>
  </div>
  <div id="coach-legend" class="legend"></div>
  <div class="sched-wrap"><div id="schedule-table"></div></div>
</div>

<!-- COACHES VIEW -->
<div class="view" id="view-coaches">
  <div class="page-hdr"><h1 class="page-title">Coaches</h1></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">
    <div>
      <div class="card">
        <div class="card-header" id="coach-form-title">Add Coach</div>
        <div class="card-body">
          <form id="coach-form" onsubmit="handleCoachSubmit(event)">
            <div class="form-group"><label>Name *</label><input type="text" id="coach-name" placeholder="Coach name" required></div>
            <div class="form-group"><label>Contact</label><input type="text" id="coach-contact" placeholder="Phone or email"></div>
            <div class="form-group"><label>Hourly Rate (RM)</label><input type="number" id="coach-rate" min="0" step="0.50" placeholder="0.00"></div>
            <div class="form-group"><label class="chk-row"><input type="checkbox" id="coach-active" checked> Active</label></div>
            <div style="display:flex;gap:8px">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" class="btn btn-outline" id="coach-cancel-btn" onclick="cancelCoachEdit()" style="display:none">Cancel</button>
            </div>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Venues / Courts</div>
        <div class="card-body" style="padding-top:12px">
          <div id="venues-list" style="margin-bottom:12px"></div>
          <form id="venue-form" onsubmit="handleVenueSubmit(event)" style="display:flex;gap:8px">
            <input type="text" id="venue-name" placeholder="New venue name" style="flex:1">
            <button type="submit" class="btn btn-outline btn-sm">Add</button>
          </form>
        </div>
      </div>
    </div>
    <div class="card"><div id="coaches-list"></div></div>
  </div>
</div>

<!-- TRACKER VIEW -->
<div class="view" id="view-tracker">
  <div class="page-hdr">
    <h1 class="page-title">Monthly Tracker</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;color:#64748b">Month:</label>
      <select id="tracker-month" class="fc" style="width:auto" onchange="trackerMonth=this.value;expandedCoach=null;renderTracker()"></select>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" style="color:#2563eb" id="ts-coaches">0</div><div class="stat-lbl">Active coaches</div></div>
    <div class="stat"><div class="stat-val" id="ts-hours">0</div><div class="stat-lbl">Total hours</div></div>
    <div class="stat"><div class="stat-val" style="color:#16a34a" id="ts-pay">RM 0</div><div class="stat-lbl">Total payroll</div></div>
  </div>
  <div id="tracker-table"></div>
</div>

</main>

<!-- ADD SESSION MODAL -->
<div class="overlay" id="add-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <h2 id="modal-title">Add Session</h2>
    <form onsubmit="handleAddSession(event)">
      <div class="form-group"><label>Coach</label><select id="modal-coach" class="fc" required></select></div>
      <div class="form-group"><label>Venue</label><select id="modal-venue" class="fc" required></select></div>
      <div class="form-row" style="margin-bottom:12px">
        <div class="form-group" style="margin:0"><label>Start</label><input type="time" id="modal-start" step="1800" required></div>
        <div class="form-group" style="margin:0"><label>End</label><input type="time" id="modal-end" step="1800" required></div>
      </div>
      <div class="form-group"><label class="chk-row"><input type="checkbox" id="modal-recurring"> <span id="modal-rec-lbl">Recurring weekly</span></label></div>
      <div class="mactions">
        <button type="submit" class="btn btn-primary" style="flex:1">Add Session</button>
        <button type="button" class="btn btn-outline" onclick="document.getElementById('add-modal').classList.remove('open')">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────
const S = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || '[]') } catch { return [] } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)) },
  nextId(a) { return a.length ? Math.max(...a.map(i => i.id)) + 1 : 1 }
};

(function init() {
  if (localStorage.getItem('cmp_v1')) return;
  S.set('coaches', []);
  S.set('venues', [{ id:1,name:'Court 1' }, { id:2,name:'Court 2' }, { id:3,name:'Court 3' }]);
  S.set('sessions', []);
  S.set('instances', []);
  localStorage.setItem('cmp_v1', '1');
})();

const getCoaches  = () => S.get('coaches');
const getVenues   = () => S.get('venues');
const getInstances = () => S.get('instances');

function saveCoach(c) {
  const list = getCoaches();
  if (c.id) { const i = list.findIndex(x => x.id === c.id); if (i >= 0) list[i] = c; }
  else { c = { ...c, id: S.nextId(list) }; list.push(c); }
  S.set('coaches', list); return c;
}
function saveVenue(v) {
  const list = getVenues();
  if (v.id) { const i = list.findIndex(x => x.id === v.id); if (i >= 0) list[i] = v; }
  else { v = { ...v, id: S.nextId(list) }; list.push(v); }
  S.set('venues', list); return v;
}
function saveSession(s) {
  const list = S.get('sessions');
  s = { ...s, id: S.nextId(list) }; list.push(s);
  S.set('sessions', list); return s;
}
function updateStatus(id, status) {
  const list = getInstances();
  const i = list.findIndex(x => x.id === id);
  if (i >= 0) list[i].status = status;
  S.set('instances', list);
}
function removeInstance(id) { S.set('instances', getInstances().filter(i => i.id !== id)); }

function computeHours(s, e) {
  const [sh, sm] = s.split(':').map(Number), [eh, em] = e.split(':').map(Number);
  return (eh * 60 + em - (sh * 60 + sm)) / 60;
}
function ds(d) { return d.toISOString().split('T')[0]; }

function genRecurring(sid, cid, vid, dow, st, et, weeks) {
  const list = getInstances();
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = (dow - today.getDay() + 7) % 7;
  const first = new Date(today); first.setDate(today.getDate() + diff);
  const hrs = computeHours(st, et);
  for (let w = 0; w < weeks; w++) {
    const d = new Date(first); d.setDate(first.getDate() + w * 7);
    const dateStr = ds(d);
    if (!list.find(i => i.session_id === sid && i.date === dateStr)) {
      list.push({ id: S.nextId(list), session_id: sid, coach_id: cid, venue_id: vid, date: dateStr, start_time: st, end_time: et, status: 'scheduled', hours: hrs });
    }
  }
  S.set('instances', list);
}
function addOneOff(sid, cid, vid, dt, st, et) {
  const list = getInstances();
  list.push({ id: S.nextId(list), session_id: sid, coach_id: cid, venue_id: vid, date: dt, start_time: st, end_time: et, status: 'scheduled', hours: computeHours(st, et) });
  S.set('instances', list);
}

// ── HELPERS ───────────────────────────────────────────────────
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function t2d(t) { const [h,m] = t.split(':').map(Number); return h + m/60; }
function d2t(d) { return `${String(Math.floor(d)).padStart(2,'0')}:${d%1>=.5?'30':'00'}`; }

// ── VIEW MANAGER ──────────────────────────────────────────────
function showView(v) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.getElementById('nav-' + v).classList.add('active');
  if (v === 'schedule') renderSchedule();
  if (v === 'coaches')  renderCoaches();
  if (v === 'tracker')  renderTracker();
}

// ── SCHEDULE ──────────────────────────────────────────────────
let baseDate = new Date();

function getWeekDates(b) {
  const d = new Date(b), day = d.getDay();
  const mon = new Date(d); mon.setDate(d.getDate() - ((day + 6) % 7)); mon.setHours(0,0,0,0);
  return Array.from({ length: 7 }, (_, i) => { const dd = new Date(mon); dd.setDate(mon.getDate() + i); return dd; });
}
function shiftWeek(n) { baseDate = new Date(baseDate); baseDate.setDate(baseDate.getDate() + n*7); renderSchedule(); }
function goToday()    { baseDate = new Date(); renderSchedule(); }

function renderSchedule() {
  const wk = getWeekDates(baseDate);
  const insts = getInstances();
  const coaches = getCoaches();
  const venues  = getVenues();
  const cMap = Object.fromEntries(coaches.map(c => [c.id, c]));
  const vMap = Object.fromEntries(venues.map(v  => [v.id, v]));
  const cColors = {}; coaches.forEach((c,i) => cColors[c.id] = i % 7);

  document.getElementById('week-label').textContent = `${ds(wk[0])} — ${ds(wk[6])}`;
  document.getElementById('coach-legend').innerHTML =
    coaches.map(c => `<span class="lchip cc${cColors[c.id]}">${esc(c.name)}</span>`).join('') +
    '<span style="font-size:11px;color:#94a3b8;margin-left:4px">· Click empty cell to add session</span>';

  const today  = ds(new Date());
  const wkInsts = insts.filter(i => i.date >= ds(wk[0]) && i.date <= ds(wk[6]));
  const slots = [];
  for (let h = 6; h < 22; h++) { slots.push(h); slots.push(h + .5); }

  let html = '<table class="sched"><thead><tr><th class="tcorner" style="width:52px"></th>';
  wk.forEach(d => {
    const it = ds(d) === today;
    html += `<th class="${it ? 'today-h' : ''}"><div>${DAYS[d.getDay()]}</div><div style="font-size:16px${it?';font-weight:700':''}">${d.getDate()}</div></th>`;
  });
  html += '</tr></thead><tbody>';

  slots.forEach(h => {
    const isHalf = h % 1 !== 0;
    html += `<tr><td class="ttime">${isHalf ? '' : d2t(h)}</td>`;
    wk.forEach(d => {
      const dateStr = ds(d);
      const slotI = wkInsts.filter(i => {
        if (i.date !== dateStr) return false;
        const s = t2d(i.start_time), e = t2d(i.end_time);
        return s <= h && e > h;
      });
      const startI  = slotI.filter(i => t2d(i.start_time) === h);
      const isEmpty  = slotI.length === 0;
      html += `<td class="tslot${isHalf?' half':''}${isEmpty?' empty':''}" data-date="${dateStr}" data-day="${d.getDay()}" data-hour="${h}" onclick="slotClick(this,${!isEmpty})">`;
      startI.forEach(inst => {
        const dur = t2d(inst.end_time) - t2d(inst.start_time);
        const hpx = dur * 2 * 28 - 2;
        const cc  = `cc${cColors[inst.coach_id] ?? 0}`;
        const sc  = inst.status === 'cancelled' ? 'cancelled' : inst.status === 'completed' ? 'completed' : '';
        const si  = inst.status === 'completed' ? '✅' : inst.status === 'cancelled' ? '❌' : '⬜';
        html += `<div class="sblock ${cc} ${sc}" style="height:${hpx}px">
          <div class="sn">${esc(cMap[inst.coach_id]?.name ?? '?')}</div>
          <div class="sv">${esc(vMap[inst.venue_id]?.name ?? '?')}</div>
          <div class="sa">
            <button title="Cycle status" onclick="cycleStatus(${inst.id})">${si}</button>
            <button title="Delete" style="color:#ef4444" onclick="delInst(${inst.id})">✕</button>
          </div>
        </div>`;
      });
      html += '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('schedule-table').innerHTML = html;
}

function slotClick(td, occupied) {
  if (occupied) return;
  openModal(td.dataset.date, parseInt(td.dataset.day), parseFloat(td.dataset.hour));
}
function cycleStatus(id) {
  const inst = getInstances().find(x => x.id === id); if (!inst) return;
  const next = inst.status === 'scheduled' ? 'completed' : inst.status === 'completed' ? 'cancelled' : 'scheduled';
  updateStatus(id, next); renderSchedule();
}
function delInst(id) {
  if (confirm('Delete this session?')) { removeInstance(id); renderSchedule(); }
}

let mDate = '', mDay = 0, mHour = 0;
function openModal(date, day, hour) {
  mDate = date; mDay = day; mHour = hour;
  const coaches = getCoaches().filter(c => c.active);
  const venues  = getVenues();
  if (!coaches.length) { alert('Add at least one coach first (Coaches tab).'); return; }
  document.getElementById('modal-title').textContent = `Add Session — ${date} (${DAYS[day]})`;
  document.getElementById('modal-coach').innerHTML = coaches.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  document.getElementById('modal-venue').innerHTML = venues.map(v  => `<option value="${v.id}">${esc(v.name)}</option>`).join('');
  document.getElementById('modal-start').value = d2t(hour);
  document.getElementById('modal-end').value   = d2t(hour + 1);
  document.getElementById('modal-recurring').checked = false;
  document.getElementById('modal-rec-lbl').textContent = `Recurring every ${DAYS[day]}`;
  document.getElementById('add-modal').classList.add('open');
}
function handleAddSession(e) {
  e.preventDefault();
  const cid = parseInt(document.getElementById('modal-coach').value);
  const vid = parseInt(document.getElementById('modal-venue').value);
  const st  = document.getElementById('modal-start').value;
  const et  = document.getElementById('modal-end').value;
  const rec = document.getElementById('modal-recurring').checked;
  if (st >= et) { alert('End time must be after start time.'); return; }
  const sess = saveSession({ coach_id:cid, venue_id:vid, recurring:rec?1:0, day_of_week:rec?mDay:null, date:rec?null:mDate, start_time:st, end_time:et });
  if (rec) genRecurring(sess.id, cid, vid, mDay, st, et, 12);
  else     addOneOff(sess.id, cid, vid, mDate, st, et);
  document.getElementById('add-modal').classList.remove('open');
  renderSchedule();
}

// ── COACHES ───────────────────────────────────────────────────
let editCoachId = null;

function renderCoaches() {
  const coaches = getCoaches(), venues = getVenues();
  document.getElementById('coach-form-title').textContent = editCoachId ? 'Edit Coach' : 'Add Coach';
  document.getElementById('coach-cancel-btn').style.display = editCoachId ? 'inline-flex' : 'none';

  let html = '';
  if (!coaches.length) {
    html = '<div class="empty">No coaches yet.</div>';
  } else {
    html = `<table class="dtable"><thead><tr><th>Name</th><th>Contact</th><th>Rate/hr</th><th>Status</th><th></th></tr></thead><tbody>`;
    coaches.forEach(c => {
      html += `<tr style="${c.active?'':'opacity:.5'}">
        <td style="font-weight:500">${esc(c.name)}</td>
        <td style="color:#64748b">${esc(c.contact || '—')}</td>
        <td>${c.hourly_rate > 0 ? 'RM ' + Number(c.hourly_rate).toFixed(2) : '—'}</td>
        <td><button onclick="toggleCoach(${c.id})" class="badge ${c.active?'bg':'bgr'}" style="cursor:pointer">${c.active?'Active':'Inactive'}</button></td>
        <td><button class="btn btn-outline btn-sm" onclick="startEditCoach(${c.id})">Edit</button></td>
      </tr>`;
    });
    html += '</tbody></table>';
  }
  document.getElementById('coaches-list').innerHTML = html;

  let vhtml = venues.map(v =>
    `<div style="display:flex;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:13px">${esc(v.name)}</div>`
  ).join('');
  document.getElementById('venues-list').innerHTML = vhtml || '<div style="color:#94a3b8;font-size:12px;margin-bottom:8px">No venues yet.</div>';
}
function startEditCoach(id) {
  const c = getCoaches().find(x => x.id === id); if (!c) return;
  editCoachId = id;
  document.getElementById('coach-name').value    = c.name;
  document.getElementById('coach-contact').value = c.contact || '';
  document.getElementById('coach-rate').value    = c.hourly_rate || '';
  document.getElementById('coach-active').checked = Boolean(c.active);
  renderCoaches();
  document.getElementById('coach-name').focus();
}
function cancelCoachEdit() {
  editCoachId = null;
  document.getElementById('coach-form').reset();
  document.getElementById('coach-active').checked = true;
  renderCoaches();
}
function handleCoachSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('coach-name').value.trim(); if (!name) return;
  const data = { name, contact: document.getElementById('coach-contact').value.trim(), hourly_rate: parseFloat(document.getElementById('coach-rate').value) || 0, active: document.getElementById('coach-active').checked ? 1 : 0 };
  if (editCoachId) data.id = editCoachId;
  saveCoach(data);
  cancelCoachEdit();
}
function toggleCoach(id) {
  const c = getCoaches().find(x => x.id === id);
  if (c) { saveCoach({ ...c, active: c.active ? 0 : 1 }); renderCoaches(); }
}
function handleVenueSubmit(e) {
  e.preventDefault();
  const name = document.getElementById('venue-name').value.trim(); if (!name) return;
  saveVenue({ name });
  document.getElementById('venue-form').reset();
  renderCoaches();
}

// ── TRACKER ───────────────────────────────────────────────────
function curMonth() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function monthLabel(ym) { const [y,m] = ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleString('default',{month:'long',year:'numeric'}); }

let trackerMonth = curMonth(), expandedCoach = null;

function renderTracker() {
  const sel = document.getElementById('tracker-month');
  if (!sel.innerHTML) {
    sel.innerHTML = Array.from({ length: 15 }, (_, i) => {
      const d = new Date(); d.setMonth(d.getMonth() - 12 + i);
      const ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      return `<option value="${ym}">${monthLabel(ym)}</option>`;
    }).join('');
  }
  sel.value = trackerMonth;

  const coaches  = getCoaches();
  const venues   = getVenues();
  const vMap     = Object.fromEntries(venues.map(v => [v.id, v]));
  const mInsts   = getInstances().filter(i => i.date.startsWith(trackerMonth));

  const sums = coaches.map(c => {
    const ci = mInsts.filter(i => i.coach_id === c.id);
    const hrs = ci.filter(i => i.status !== 'cancelled').reduce((a, i) => a + i.hours, 0);
    return { c, ci, total: ci.length, done: ci.filter(i=>i.status==='completed').length, sched: ci.filter(i=>i.status==='scheduled').length, canc: ci.filter(i=>i.status==='cancelled').length, hrs, earn: hrs * c.hourly_rate };
  }).filter(s => s.total > 0);

  const gHrs  = sums.reduce((a,s) => a + s.hrs, 0);
  const gEarn = sums.reduce((a,s) => a + s.earn, 0);
  document.getElementById('ts-coaches').textContent = sums.length;
  document.getElementById('ts-hours').textContent   = gHrs.toFixed(1);
  document.getElementById('ts-pay').textContent     = 'RM ' + gEarn.toFixed(2);

  if (!sums.length) {
    document.getElementById('tracker-table').innerHTML = `<div class="card"><div class="empty">No sessions found for ${monthLabel(trackerMonth)}.</div></div>`;
    return;
  }

  let html = `<div class="card"><table class="dtable">
    <thead><tr>
      <th>Coach</th><th style="text-align:center">Total</th><th style="text-align:center">Done</th>
      <th style="text-align:center">Pending</th><th style="text-align:center">Cancelled</th>
      <th style="text-align:right">Hours</th><th style="text-align:right">Earnings</th><th></th>
    </tr></thead><tbody>`;

  sums.forEach(s => {
    const exp = expandedCoach === s.c.id;
    html += `<tr style="cursor:pointer" onclick="toggleExpand(${s.c.id})">
      <td style="font-weight:500">${esc(s.c.name)}</td>
      <td style="text-align:center">${s.total}</td>
      <td style="text-align:center;color:#16a34a">${s.done}</td>
      <td style="text-align:center;color:#2563eb">${s.sched}</td>
      <td style="text-align:center;color:#94a3b8">${s.canc}</td>
      <td style="text-align:right;font-weight:600">${s.hrs.toFixed(1)}h</td>
      <td style="text-align:right;color:#16a34a;font-weight:600">${s.earn > 0 ? 'RM ' + s.earn.toFixed(2) : '—'}</td>
      <td style="color:#94a3b8;font-size:11px">${exp?'▲':'▼'}</td>
    </tr>`;
    if (exp) {
      html += `<tr class="expand-row"><td colspan="8"><div class="expand-inner">
        <div style="font-size:11px;color:#64748b;margin-bottom:8px">Sessions in ${monthLabel(trackerMonth)}</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="color:#94a3b8">
            <th style="text-align:left;padding-bottom:4px">Date</th><th style="text-align:left;padding-bottom:4px">Time</th>
            <th style="text-align:left;padding-bottom:4px">Venue</th><th style="text-align:right;padding-bottom:4px">Hours</th>
            <th style="text-align:center;padding-bottom:4px">Status</th>
          </tr></thead><tbody>`;
      s.ci.sort((a,b) => a.date.localeCompare(b.date)).forEach(inst => {
        const bk = inst.status==='completed'?'bg':inst.status==='cancelled'?'br':'bb';
        html += `<tr style="border-top:1px solid #f1f5f9">
          <td style="padding:4px 0;color:#475569">${inst.date}</td>
          <td style="padding:4px 0;color:#94a3b8">${inst.start_time}–${inst.end_time}</td>
          <td style="padding:4px 0;color:#94a3b8">${esc(vMap[inst.venue_id]?.name ?? '?')}</td>
          <td style="padding:4px 0;text-align:right">${inst.hours.toFixed(1)}h</td>
          <td style="padding:4px 0;text-align:center">
            <select class="status-sel ${bk}" onclick="event.stopPropagation()" onchange="setStatus(${inst.id},this.value)">
              <option value="scheduled"${inst.status==='scheduled'?' selected':''}>Scheduled</option>
              <option value="completed"${inst.status==='completed'?' selected':''}>Completed</option>
              <option value="cancelled"${inst.status==='cancelled'?' selected':''}>Cancelled</option>
            </select>
          </td>
        </tr>`;
      });
      html += '</tbody></table></div></td></tr>';
    }
  });

  html += `</tbody>
    <tfoot style="border-top:2px solid #e2e8f0;background:#f8fafc"><tr>
      <td style="padding:10px 16px;font-weight:600;color:#334155">Total</td>
      <td style="text-align:center;font-weight:600;padding:10px 16px">${sums.reduce((a,s)=>a+s.total,0)}</td>
      <td style="text-align:center;font-weight:600;color:#16a34a;padding:10px 16px">${sums.reduce((a,s)=>a+s.done,0)}</td>
      <td style="text-align:center;font-weight:600;color:#2563eb;padding:10px 16px">${sums.reduce((a,s)=>a+s.sched,0)}</td>
      <td style="text-align:center;font-weight:600;color:#94a3b8;padding:10px 16px">${sums.reduce((a,s)=>a+s.canc,0)}</td>
      <td style="text-align:right;font-weight:700;padding:10px 16px">${gHrs.toFixed(1)}h</td>
      <td style="text-align:right;font-weight:700;color:#16a34a;padding:10px 16px">RM ${gEarn.toFixed(2)}</td>
      <td></td>
    </tr></tfoot>
  </table></div>`;
  document.getElementById('tracker-table').innerHTML = html;
}
function toggleExpand(id) { expandedCoach = expandedCoach === id ? null : id; renderTracker(); }
function setStatus(id, status) { updateStatus(id, status); renderTracker(); }

// ── BOOT ──────────────────────────────────────────────────────
showView('schedule');
</script>
</body>
</html>
