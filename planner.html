<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🏸 Coach Manpower Planner</title>
<style>
:root{
  --bg:#f9fafb;--surf:#fff;--surf2:#f3f4f6;--bdr:#d1d5db;
  --tx:#111827;--txm:#6b7280;--txf:#9ca3af;--hov:#f3f4f6;
  --blue:#3b82f6;--bluebg:#eff6ff;--green:#10b981;--red:#ef4444;
  --slot:40px;
}
[data-dark]{
  --bg:#0f172a;--surf:#1e293b;--surf2:#0f172a;--bdr:#334155;
  --tx:#f1f5f9;--txm:#94a3b8;--txf:#334155;--hov:#334155;
  --blue:#60a5fa;--bluebg:#1e3058;--green:#4ade80;--red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:13px;line-height:1.4;-webkit-tap-highlight-color:transparent}
nav{background:var(--surf);border-bottom:1px solid var(--bdr);padding:0 12px;display:flex;align-items:center;height:50px;gap:6px;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.brand{font-weight:800;color:var(--blue);white-space:nowrap;font-size:14px;margin-right:4px}
.nav-link{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--txm);cursor:pointer;border:none;background:none}
.nav-link:hover{background:var(--hov);color:var(--tx)}
.nav-link.active{background:var(--blue);color:#fff}
.ml{margin-left:auto}
.theme-btn{padding:5px 8px;border-radius:6px;border:1px solid var(--bdr);background:var(--surf);cursor:pointer;font-size:15px;line-height:1}
main{max-width:1300px;margin:0 auto;padding:14px}
.view{display:none}.view.active{display:block}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;overflow:hidden;margin-bottom:14px}
.card-body{padding:16px}
.card-hdr{padding:11px 16px;border-bottom:1px solid var(--bdr);font-weight:700;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 13px;border-radius:6px;font-size:12px;font-weight:600;border:1px solid transparent;cursor:pointer}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{opacity:.88}
.btn-o{background:var(--surf);color:var(--txm);border-color:var(--bdr)}.btn-o:hover{background:var(--hov)}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-red{color:var(--red);border-color:var(--red);background:transparent}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--txm);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=number],input[type=time],input[type=color],select.fc{width:100%;border:1px solid var(--bdr);border-radius:6px;padding:6px 9px;font-size:13px;outline:none;font-family:inherit;background:var(--surf);color:var(--tx)}
input:focus,select.fc:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
input[type=color]{padding:2px 4px;height:34px;cursor:pointer}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk-row{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:2px 0}
.chk-row input{width:auto}
/* sched controls */
.sub-tog{display:inline-flex;border:1px solid var(--bdr);border-radius:7px;overflow:hidden;margin-bottom:12px}
.sub-tog button{padding:4px 14px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:var(--surf);color:var(--txm)}
.sub-tog button.active{background:var(--blue);color:#fff}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ctrl-lbl{font-weight:700;font-size:13px}
.legend-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.lchip{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid rgba(0,0,0,.2)}
/* weekly grid */
.sched-outer{overflow-x:auto;border:1px solid var(--bdr);border-radius:10px;background:var(--surf);user-select:none}
table.sched{border-collapse:collapse;min-width:900px;width:100%;font-size:11px}
table.sched th{background:var(--surf2);padding:5px 3px;text-align:center;font-weight:700;color:var(--txm);border:1px solid var(--bdr);white-space:nowrap;min-width:180px}
table.sched th.today-h{background:var(--bluebg);color:var(--blue)}
table.sched th.corner{width:52px;min-width:52px;position:sticky;left:0;z-index:20}
table.sched td.ttime{width:52px;text-align:right;padding:0 5px;color:var(--txf);background:var(--surf2);border:1px solid var(--bdr);white-space:nowrap;position:sticky;left:0;z-index:10;height:var(--slot);font-size:10px;vertical-align:middle}
table.sched td.tslot{border:1px solid var(--bdr);border-right:none;padding:0;vertical-align:top;position:relative;height:var(--slot);cursor:crosshair}
table.sched td.tslot:last-child{border-right:1px solid var(--bdr)}
table.sched td.tslot.half{border-top-style:dashed}
table.sched td.tslot.drag-hi{background:rgba(37,99,235,.13)}
/* session block */
.sblock{position:absolute;border-radius:6px;padding:4px 6px;overflow:hidden;font-size:11px;line-height:1.35;border:1px solid rgba(0,0,0,.18);box-shadow:0 2px 6px rgba(0,0,0,.15);z-index:10;top:0;cursor:grab;transition:box-shadow .1s}
.sblock:hover{box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:50}
.sblock.dragging{opacity:.6;cursor:grabbing;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.sblock.cancelled{opacity:.38;text-decoration:line-through}
.sblock.completed{opacity:.78}
.sb-venue{font-weight:800;font-size:11.5px}
.sb-row{font-size:10px;opacity:.92;margin-top:1px}
.sb-coach{font-size:10px;font-weight:700;margin-top:2px}
.sb-time{font-size:10px;opacity:.82;margin-top:1px}
.sb-btns{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.sb-btns button{background:rgba(0,0,0,.2);border:none;cursor:pointer;padding:2px 6px;font-size:10px;border-radius:4px;line-height:1.4;font-weight:700;white-space:nowrap}
.sb-btns button:hover{background:rgba(0,0,0,.35)}
.sb-resize{position:absolute;bottom:0;left:0;right:0;height:8px;cursor:ns-resize;background:rgba(0,0,0,.18);border-radius:0 0 6px 6px;display:flex;align-items:center;justify-content:center}
.sb-resize::after{content:'';width:24px;height:2px;border-radius:2px;background:rgba(255,255,255,.6)}
/* clipboard bar */
#clip-bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:24px;font-size:12px;font-weight:600;display:none;align-items:center;gap:10px;z-index:400;box-shadow:0 4px 20px rgba(0,0,0,.3);white-space:nowrap}
#clip-bar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:2px 10px;border-radius:12px;cursor:pointer;font-size:11px}
.sblock.selected{outline:3px solid #fff;box-shadow:0 0 0 4px var(--blue),0 4px 12px rgba(0,0,0,.25)!important}
/* monthly chip dragging */
.cal-chip{font-size:10px;padding:3px 6px;border-radius:4px;border:1px solid rgba(0,0,0,.18);margin-bottom:3px;line-height:1.4;cursor:grab;user-select:none}
.cal-chip:active{cursor:grabbing}
.cal-chip-venue{font-weight:800}
.cal-chip-sub{opacity:.88;font-size:9.5px}
.cal-cell.drop-target{background:rgba(37,99,235,.12);outline:2px dashed var(--blue)}
/* collapsible cards */
.card-hdr-btn{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.card-hdr-btn:hover{background:var(--surf2)}
.cal-wrap{border:1px solid var(--bdr);border-radius:10px;overflow:hidden;background:var(--surf)}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:2px solid var(--bdr)}
.cal-dow{text-align:center;padding:6px 3px;font-size:11px;font-weight:800;color:var(--txm);background:var(--surf2);text-transform:uppercase;letter-spacing:.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:280px;border-right:1px solid var(--bdr);border-bottom:1px solid var(--bdr);padding:6px;transition:background .1s;position:relative}
.cal-cell:hover{background:var(--hov)}
.cal-cell.other{opacity:.28;cursor:default}
.cal-cell.today .cal-num{background:var(--blue);color:#fff;border-radius:50%}
.cal-num{font-size:11px;font-weight:800;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:3px}
.cal-chip{font-size:10px;padding:2px 5px;border-radius:3px;border:1px solid rgba(0,0,0,.18);margin-bottom:2px;line-height:1.35}
.cal-chip-venue{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip-sub{opacity:.88;font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* coaches table */
.dtable{width:100%;border-collapse:collapse;font-size:12px}
.dtable th{text-align:left;padding:9px 14px;background:var(--surf2);border-bottom:1px solid var(--bdr);font-weight:700;color:var(--txm);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.dtable td{padding:9px 14px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.dtable tr:last-child td{border-bottom:none}
.dtable tbody tr:hover td{background:var(--hov)}
.badge{display:inline-flex;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;border:1px solid;cursor:pointer}
.b-g{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.b-gr{background:var(--surf2);color:var(--txm);border-color:var(--bdr)}
[data-dark] .b-g{background:#14532d;color:#4ade80;border-color:#166534}
.color-btn{height:20px;border-radius:5px;border:2px solid transparent;cursor:pointer;transition:all .15s;width:100%}
.color-btn:hover{transform:scale(1.08);border-color:rgba(0,0,0,.2)}
.color-btn.sel{border-color:#000!important;box-shadow:0 0 0 2px var(--surf),0 0 0 4px #000}
/* tracker */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{border:3px solid;border-radius:10px;padding:14px;text-align:center}
.tc-name{font-weight:800;font-size:13px;margin-bottom:6px}
.tc-hrs{font-size:28px;font-weight:900;line-height:1}
.tc-lbl{font-size:10px;color:var(--txm);margin-top:3px}
.tc-sub{font-size:10px;color:var(--txm);margin-top:4px}
/* modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.modal{background:var(--surf);border-radius:12px;padding:20px;width:100%;max-width:430px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:93vh;overflow-y:auto}
.modal h2{font-size:14px;font-weight:800;margin-bottom:14px}
.mact{display:flex;gap:8px;margin-top:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
/* coach chips (no checkbox) */
.cchk-wrap{display:flex;flex-wrap:wrap;gap:5px}
.cchk{display:flex;align-items:center;gap:5px;border:1.5px solid var(--bdr);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700;background:var(--surf2);transition:all .15s;user-select:none}
.cchk:hover{background:var(--hov)}
.cchk.on{border-color:var(--blue);background:var(--bluebg);color:var(--blue)}
.page-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.page-title{font-size:16px;font-weight:800}
.empty{text-align:center;padding:28px;color:var(--txf);font-size:12px}
/* day modal sessions */
.day-item{border-left:4px solid;border-radius:6px;padding:9px 12px;margin-bottom:8px;background:var(--surf2)}
@media(max-width:640px){.two-col{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
  <span class="brand">🏸 Coach Planner</span>
  <button class="nav-link active" id="nav-schedule" onclick="showView('schedule')">Schedule</button>
  <button class="nav-link" id="nav-coaches" onclick="showView('coaches')">Coaches</button>
  <button class="nav-link" id="nav-tracker" onclick="showView('tracker')">Tracker</button>
  <button class="theme-btn ml" id="theme-btn" onclick="toggleTheme()">🌙</button>
</nav>

<main>

<!-- SCHEDULE -->
<div class="view active" id="view-schedule">
  <div class="sub-tog">
    <button id="tog-w" class="active" onclick="switchSched('week')">Week</button>
    <button id="tog-m" onclick="switchSched('month')">Month</button>
  </div>

  <div id="sv-week">
    <div class="ctrl-row">
      <button class="btn btn-o btn-sm" onclick="shiftWeek(-1)">◀ Prev</button>
      <span class="ctrl-lbl" id="week-lbl"></span>
      <button class="btn btn-o btn-sm" onclick="shiftWeek(1)">Next ▶</button>
      <button class="btn btn-o btn-sm" onclick="baseDate=new Date();renderWeek()" style="color:var(--blue)">Today</button>
      <span style="font-size:11px;color:var(--txf)">· Drag to select time range</span>
    </div>
    <div id="legend-w" class="legend-wrap"></div>
    <div class="sched-outer">
      <table class="sched">
        <thead id="sched-head"></thead>
        <tbody id="sched-body"></tbody>
      </table>
    </div>
  </div>

  <div id="sv-month" style="display:none">
    <div class="ctrl-row">
      <button class="btn btn-o btn-sm" onclick="shiftMonth(-1)">◀ Prev</button>
      <span class="ctrl-lbl" id="month-lbl"></span>
      <button class="btn btn-o btn-sm" onclick="shiftMonth(1)">Next ▶</button>
      <button class="btn btn-o btn-sm" onclick="calDate=new Date();renderMonth()" style="color:var(--blue)">Today</button>
    </div>
    <div id="legend-m" class="legend-wrap"></div>
    <div class="cal-wrap">
      <div class="cal-dow-row" id="cal-dows"></div>
      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>
</div>

<!-- COACHES -->
<div class="view" id="view-coaches">
  <div class="page-hdr"><h1 class="page-title">Coaches</h1></div>
  <div class="two-col">
    <div>
      <div class="card">
        <div class="card-hdr card-hdr-btn" onclick="toggleCard('coach-form-body','coach-form-chevron')">
          <span id="coach-form-hdr">Add Coach</span><span id="coach-form-chevron">▼</span>
        </div>
        <div class="card-body" id="coach-form-body">
          <form id="coach-form" onsubmit="submitCoach(event)">
            <div class="fg"><label>Name *</label><input type="text" id="cn" required placeholder="Coach name"></div>
            <div class="fg"><label>Block Color</label>
              <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:2px">
                <button type="button" class="color-btn" data-color="#ef4444" style="background:#ef4444" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="#f97316" style="background:#f97316" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="#facc15" style="background:#facc15" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="#22c55e" style="background:#22c55e" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="#06b6d4" style="background:#06b6d4" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="#3b82f6" style="background:#3b82f6" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="#8b5cf6" style="background:#8b5cf6" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="#f472b6" style="background:#f472b6" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="#ffffff" style="background:#fff;border-color:#d1d5db" onclick="setCoachColor(this)"></button>
                <button type="button" class="color-btn" data-color="" style="background:linear-gradient(135deg,#fff 44%,#ef4444 44%,#ef4444 56%,#fff 56%);border-color:#d1d5db" onclick="setCoachColor(this)" title="No color"></button>
              </div>
              <input type="color" id="ccolor" value="#3b82f6" style="display:none">
            </div>
            <div class="fg"><label class="chk-row"><input type="checkbox" id="cactive" checked> Active</label></div>
            <div style="display:flex;gap:8px">
              <button type="submit" class="btn btn-p">Save</button>
              <button type="button" class="btn btn-o" id="coach-cancel" style="display:none" onclick="cancelCoachEdit()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr card-hdr-btn" onclick="toggleCard('venues-body','venues-chevron')">
          <span>Venues</span><span id="venues-chevron">▼</span>
        </div>
        <div class="card-body" id="venues-body" style="padding-top:10px">
          <div id="venues-list" style="margin-bottom:10px"></div>
          <form id="venue-form" onsubmit="addVenue(event)" style="display:flex;gap:8px">
            <input type="text" id="vn" placeholder="Venue name" required style="flex:1">
            <button type="submit" class="btn btn-o btn-sm">Add</button>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr card-hdr-btn" onclick="toggleCard('classtypes-body','ct-chevron')">
          <span>Class Types</span><span id="ct-chevron">▶</span>
        </div>
        <div class="card-body" id="classtypes-body" style="display:none;padding-top:10px">
          <div id="classtypes-list" style="margin-bottom:10px"></div>
          <form id="classtype-form" onsubmit="addClassType(event)" style="display:flex;gap:8px">
            <input type="text" id="ctn" placeholder="e.g. ActiveSG" required style="flex:1">
            <button type="submit" class="btn btn-o btn-sm">Add</button>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr card-hdr-btn" onclick="toggleCard('standards-body','std-chevron')">
          <span>Standards</span><span id="std-chevron">▶</span>
        </div>
        <div class="card-body" id="standards-body" style="display:none;padding-top:10px">
          <div id="standards-list" style="margin-bottom:10px"></div>
          <form id="standard-form" onsubmit="addStandard(event)" style="display:flex;gap:8px">
            <input type="text" id="stn" placeholder="e.g. Advance" required style="flex:1">
            <button type="submit" class="btn btn-o btn-sm">Add</button>
          </form>
        </div>
      </div>
      <div class="card">
        <div class="card-hdr card-hdr-btn" onclick="toggleCard('combo-colors-body','combo-chevron')">
          <span>Coach Combo Colors</span><span id="combo-chevron">▶</span>
        </div>
        <div class="card-body" id="combo-colors-body" style="display:none">
          <div id="combo-colors"></div>
        </div>
      </div>
    </div>
    <div class="card"><div id="coaches-list"></div></div>
  </div>
</div>

<!-- TRACKER -->
<div class="view" id="view-tracker">
  <div class="page-hdr">
    <h1 class="page-title">Monthly Tracker</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:12px;color:var(--txm)">Month:</label>
      <select id="tracker-month" class="fc" style="width:auto" onchange="trackerMonth=this.value;renderTracker()"></select>
    </div>
  </div>
  <div id="tracker-content"></div>
</div>

</main>

<!-- SESSION MODAL -->
<div class="overlay" id="sess-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="sess-ttl">Add Session</h2>
    <div class="fg"><label>Coaches</label><div id="cchk-wrap" class="cchk-wrap"></div></div>
    <div class="fg"><label>Block Color</label>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px">
        <button type="button" class="color-btn" data-color="#ef4444" style="background:#ef4444" onclick="setModalColor('#ef4444')"></button>
        <button type="button" class="color-btn" data-color="#f97316" style="background:#f97316" onclick="setModalColor('#f97316')"></button>
        <button type="button" class="color-btn" data-color="#facc15" style="background:#facc15" onclick="setModalColor('#facc15')"></button>
        <button type="button" class="color-btn" data-color="#22c55e" style="background:#22c55e" onclick="setModalColor('#22c55e')"></button>
        <button type="button" class="color-btn" data-color="#06b6d4" style="background:#06b6d4" onclick="setModalColor('#06b6d4')"></button>
        <button type="button" class="color-btn" data-color="#3b82f6" style="background:#3b82f6" onclick="setModalColor('#3b82f6')"></button>
        <button type="button" class="color-btn" data-color="#8b5cf6" style="background:#8b5cf6" onclick="setModalColor('#8b5cf6')"></button>
        <button type="button" class="color-btn" data-color="#f472b6" style="background:#f472b6" onclick="setModalColor('#f472b6')"></button>
        <button type="button" class="color-btn" data-color="#ffffff" style="background:#fff;border-color:#d1d5db" onclick="setModalColor('#ffffff')"></button>
        <button type="button" class="color-btn" data-color="" style="background:linear-gradient(135deg,#fff 44%,#ef4444 44%,#ef4444 56%,#fff 56%);border-color:#d1d5db" onclick="setModalColor('')" title="No color"></button>
      </div>
      <input type="color" id="m-color" value="#3b82f6" style="display:none">
    </div>
    <div class="fg">
      <label>Venue</label>
      <input type="text" id="m-venue" list="vsugg" placeholder="e.g. Bukit Canberra SH">

    <div class="form-row">
      <div class="fg" style="margin:0">
        <label>Class</label>
        <input type="text" id="m-class" list="clsugg" placeholder="e.g. ActiveSG">
        <datalist id="clsugg"></datalist>
      </div>
      <div class="fg" style="margin:0">
        <label>Standard</label>
        <input type="text" id="m-std" list="stsugg" placeholder="e.g. Advance">
        <datalist id="stsugg"></datalist>
      </div>
    </div>
    <div class="fg"><label>Court No (free text)</label><input type="text" id="m-court" placeholder="e.g. 5 &amp; 6, Court 1 &amp; 2"></div>
    <div class="form-row">
      <div class="fg" style="margin:0"><label>Start</label><input type="time" id="m-start" step="1800" required></div>
      <div class="fg" style="margin:0"><label>End</label><input type="time" id="m-end" step="1800" required></div>
    </div>
    <div class="fg"><label>Notes (optional)</label><input type="text" id="m-notes" placeholder="e.g. *Spare*, 1 Hour only"></div>

      <button type="button" id="m-rec-btn" onclick="toggleRec()" class="btn btn-o" style="width:100%;justify-content:center">
        Recurring every <span id="m-rec-day">Sun</span>: Off
      </button>

      <button class="btn btn-p" style="flex:1" onclick="submitSession()">Save</button>
      <button class="btn btn-red" id="m-del-btn" style="display:none" onclick="deleteCurrentInst()">Delete</button>

  <div class="modal">
    <h2 id="day-ttl"></h2>
    <div id="day-body"></div>

      <button class="btn btn-p" style="flex:1" onclick="openAddFromDay()">+ Add Session</button>
      <button class="btn btn-o" onclick="document.getElementById('day-modal').classList.remove('open')">Close</button>
    </div>
  </div>

<!-- CLIPBOARD BAR -->
<div id="clip-bar">📋 Session copied — drag any slot to paste &nbsp;<button onclick="clearClip()">Clear</button></div>

<script>
// ── THEME ─────────────────────────────────────────────────────
(function(){
  if(localStorage.getItem('cmp_theme')==='dark'){
    document.documentElement.setAttribute('data-dark','');
    document.getElementById('theme-btn').textContent='☀️';
  }
})();
function toggleTheme(){
  const on=document.documentElement.hasAttribute('data-dark');
  if(on){document.documentElement.removeAttribute('data-dark');document.getElementById('theme-btn').textContent='🌙';localStorage.setItem('cmp_theme','light')}
  else{document.documentElement.setAttribute('data-dark','');document.getElementById('theme-btn').textContent='☀️';localStorage.setItem('cmp_theme','dark')}
}

// ── STORAGE ───────────────────────────────────────────────────
const S={
  get(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))},
  nextId(a){return a.length?Math.max(...a.map(i=>i.id))+1:1}
};
(function init(){
  if(!localStorage.getItem('cmp_v3')){
    S.set('coaches',[]);
    S.set('venues',['Bukit Canberra SH','Bishan Clubhouse','Woodland SH','Sembawang Pri','Yishun SH','Arena Sport Hall']);
    S.set('sessions',[]);S.set('instances',[]);S.set('combo-colors',{});
    localStorage.setItem('cmp_v3','1');
  }
  // Migrate: seed class-types and standards if missing
  if(!localStorage.getItem('class-types'))S.set('class-types',['ActiveSG','Synchro','Rise & Rally Adult','Private Group']);
  if(!localStorage.getItem('standards'))S.set('standards',['Basic','Advance','Mix','Adult','All']);
})();

const getCoaches=()=>S.get('coaches');
const getVenues=()=>S.get('venues'); // string[]
const getInsts=()=>S.get('instances');

function saveCoach(c){
  const l=getCoaches();
  if(c.id){const i=l.findIndex(x=>x.id===c.id);if(i>=0)l[i]=c;}
  else{c={...c,id:S.nextId(l)};l.push(c);}
  S.set('coaches',l);return c;
}
function saveSession(s){
  const l=S.get('sessions');
  s={...s,id:S.nextId(l)};l.push(s);S.set('sessions',l);return s;
}
function setInstStatus(id,st){
  const l=getInsts(),i=l.findIndex(x=>x.id===id);
  if(i>=0)l[i].status=st;S.set('instances',l);
}
function delInst(id){S.set('instances',getInsts().filter(i=>i.id!==id))}
function updateInst(id,data){
  const l=getInsts(),i=l.findIndex(x=>x.id===id);
  if(i>=0)l[i]={...l[i],...data,hours:compHrs(data.start_time,data.end_time)};
  S.set('instances',l);
}

// ── HELPERS ───────────────────────────────────────────────────
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function t2d(t){const[h,m]=t.split(':').map(Number);return h+m/60}
function d2t(d){return`${String(Math.floor(d)).padStart(2,'0')}:${d%1>=.5?'30':'00'}`}
function ds(d){return d.toISOString().split('T')[0]}
function fmt12(t){if(!t)return'';const[h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';const h12=h%12||12;return m?`${h12}:${String(m).padStart(2,'0')}${ap}`:`${h12}${ap}`}
function compHrs(s,e){const[sh,sm]=s.split(':').map(Number),[eh,em]=e.split(':').map(Number);return(eh*60+em-sh*60-sm)/60}
function txColor(hex){if(!hex||hex.length<7)return'#000';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(0.299*r+0.587*g+0.114*b)/255>0.55?'#000':'#fff'}
function coachNames(ids){const coaches=getCoaches();return(ids||[]).map(id=>coaches.find(c=>c.id===id)?.name||'').filter(Boolean).join(' & ')}

function genRec(sid,data,dow){
  const l=getInsts(),today=new Date();today.setHours(0,0,0,0);
  const diff=(dow-today.getDay()+7)%7;
  const first=new Date(today);first.setDate(today.getDate()+diff);
  const hrs=compHrs(data.start_time,data.end_time);
  for(let w=0;w<12;w++){
    const d=new Date(first);d.setDate(first.getDate()+w*7);
    const dt=ds(d);
    if(!l.find(i=>i.session_id===sid&&i.date===dt))
      l.push({id:S.nextId(l),session_id:sid,...data,date:dt,status:'scheduled',hours:hrs});
  }
  S.set('instances',l);
}
function addOneOff(sid,data,date){
  const l=getInsts();
  l.push({id:S.nextId(l),session_id:sid,...data,date,status:'scheduled',hours:compHrs(data.start_time,data.end_time)});
  S.set('instances',l);
}

// ── VIEW MANAGER ──────────────────────────────────────────────
function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('nav-'+v).classList.add('active');
  if(v==='schedule')renderSched();
  if(v==='coaches')renderCoaches();
  if(v==='tracker')renderTracker();
}

// ── SCHED TOGGLE ──────────────────────────────────────────────
let schedMode='week';
function switchSched(m){
  schedMode=m;
  document.getElementById('tog-w').classList.toggle('active',m==='week');
  document.getElementById('tog-m').classList.toggle('active',m==='month');
  document.getElementById('sv-week').style.display=m==='week'?'':'none';
  document.getElementById('sv-month').style.display=m==='month'?'':'none';
  renderSched();
}
function renderSched(){schedMode==='week'?renderWeek():renderMonth()}

// ── LEGEND ────────────────────────────────────────────────────
function renderLegend(id){
  document.getElementById(id).innerHTML=
    getCoaches().map(c=>`<span class="lchip" style="background:${esc(c.color||'#3b82f6')};color:${txColor(c.color||'#3b82f6')}">${esc(c.name)}</span>`).join('')+
    `<span style="font-size:11px;color:var(--txf);margin-left:4px">${schedMode==='week'?'· Drag to select time':'· Tap day for details'}</span>`;
}

// ── CONCURRENT LAYOUT ─────────────────────────────────────────
function layoutInsts(insts){
  const sorted=[...insts].sort((a,b)=>t2d(a.start_time)-t2d(b.start_time));
  const colEnds=[];
  const result=sorted.map(inst=>{
    const s=t2d(inst.start_time),e=t2d(inst.end_time);
    let col=colEnds.findIndex(et=>et<=s);
    if(col===-1){col=colEnds.length;colEnds.push(0);}
    colEnds[col]=e;
    return{...inst,_col:col};
  });
  const total=colEnds.length||1;
  return result.map(r=>({...r,_tot:total}));
}

// ── WEEKLY VIEW ───────────────────────────────────────────────
let baseDate=new Date();
const SLOT_H=40;
let selectedInstId=null;
function selectInst(id){
  selectedInstId=id;
  document.querySelectorAll('.sblock').forEach(el=>el.classList.remove('selected'));
  const el=document.querySelector(`[data-inst-id="${id}"]`);
  if(el)el.classList.add('selected');
}
function deselectAll(){selectedInstId=null;document.querySelectorAll('.sblock').forEach(el=>el.classList.remove('selected'))}
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if((e.key==='Delete'||e.key==='Backspace')&&selectedInstId){
    e.preventDefault();
    delInst(selectedInstId);selectedInstId=null;renderSched();
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='c'&&selectedInstId){
    const inst=getInsts().find(x=>x.id===selectedInstId);
    if(inst){
      clip={coach_ids:inst.coach_ids,color:inst.color,venue_text:inst.venue_text,
            class_type:inst.class_type,standard:inst.standard,court_no:inst.court_no,
            notes:inst.notes,start_time:inst.start_time,end_time:inst.end_time};
      document.getElementById('clip-bar').style.display='flex';
    }
    e.preventDefault();return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='v'&&clip){
    document.getElementById('clip-bar').style.display='flex';
    e.preventDefault();return;
  }
});

function getWk(b){
  const d=new Date(b),day=d.getDay();
  const mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{const dd=new Date(mon);dd.setDate(mon.getDate()+i);return dd});
}
function shiftWeek(n){baseDate=new Date(baseDate);baseDate.setDate(baseDate.getDate()+n*7);renderWeek()}

function renderWeek(){
  renderLegend('legend-w');
  const wk=getWk(baseDate);
  const today=ds(new Date());
  document.getElementById('week-lbl').textContent=`${ds(wk[0])} — ${ds(wk[6])}`;
  const allI=getInsts();
  const wkI=allI.filter(i=>i.date>=ds(wk[0])&&i.date<=ds(wk[6]));
  // Pre-calculate max concurrency per day for column widths
  const dayMaxCon=wk.map(d=>{
    const laid=layoutInsts(wkI.filter(i=>i.date===ds(d)));
    return laid.length?Math.max(...laid.map(i=>i._tot)):1;
  });
  // Header
  let head=`<tr><th class="corner"></th>`;
  wk.forEach((d,di)=>{
    const it=ds(d)===today;
    const colW=Math.max(180,180*dayMaxCon[di]);
    head+=`<th class="${it?'today-h':''}" style="min-width:${colW}px"><div>${DAYS[d.getDay()]}</div><div style="font-size:16px${it?';font-weight:900':''}">${d.getDate()}</div></th>`;
  });
  document.getElementById('sched-head').innerHTML=head+'</tr>';
  // Build empty rows (6am to 10pm)
  const slots=[];for(let h=6;h<23;h++){slots.push(h);slots.push(h+.5)}
  let body='';
  slots.forEach(h=>{
    const half=h%1!==0;
    body+=`<tr><td class="ttime">${half?'':fmt12(d2t(h))}</td>`;
    wk.forEach(d=>{
      body+=`<td class="tslot${half?' half':''}" data-date="${ds(d)}" data-day="${d.getDay()}" data-h="${h}"></td>`;
    });
    body+='</tr>';
  });
  document.getElementById('sched-body').innerHTML=body;
  wk.forEach((d,di)=>{
    const dt=ds(d);
    const dayI=wkI.filter(i=>i.date===dt);
    const laid=layoutInsts(dayI);
    laid.forEach(inst=>{
      const startSlot=(t2d(inst.start_time)-6)*2;
      const endSlot=(t2d(inst.end_time)-6)*2;
      if(startSlot<0||startSlot>=34)return;
      const rowIdx=Math.floor(startSlot);
      const rows=document.querySelectorAll('#sched-body tr');
      const row=rows[rowIdx];if(!row)return;
      const cells=row.querySelectorAll('td.tslot');
      const td=cells[di];if(!td)return;
      td.style.position='relative';
      const hpx=(endSlot-startSlot)*SLOT_H-2;
      // True side-by-side: divide column equally by concurrent count
      const lp=inst._col/inst._tot*100;
      const wp=100/inst._tot;
      const rawColor=getBlockColor(inst);
      const noColor=!rawColor||rawColor==='';
      const isWhite=rawColor==='#ffffff';
      const tc=noColor?'var(--tx)':txColor(rawColor);
      const blockBg=noColor?'rgba(0,0,0,0.04)':rawColor;
      const blockBorder=noColor?'2px dashed var(--bdr)':isWhite?'1px solid #d1d5db':'1px solid rgba(0,0,0,.18)';
      const sc=inst.status==='cancelled'?'cancelled':inst.status==='completed'?'completed':'';
      const si=inst.status==='completed'?'✓':inst.status==='cancelled'?'✕':'○';
      const cn=coachNames(inst.coach_ids);
      const div=document.createElement('div');
      div.className=`sblock ${sc}${selectedInstId===inst.id?' selected':''}`;
      div.dataset.instId=String(inst.id);
      div.style.cssText=`background:${blockBg};color:${tc};border:${blockBorder};left:calc(${lp}% + 1px);width:calc(${wp}% - 2px);height:${hpx}px`;
      div.innerHTML=`
        ${inst.venue_text?`<div class="sb-venue">${esc(inst.venue_text)}</div>`:'<div class="sb-venue" style="opacity:.4">—</div>'}
        <div class="sb-time">${fmt12(inst.start_time)} – ${fmt12(inst.end_time)}</div>
        ${inst.class_type||inst.standard?`<div class="sb-row">${esc([inst.class_type,inst.standard].filter(Boolean).join(', '))}</div>`:''}
        ${inst.court_no?`<div class="sb-row">Court: ${esc(inst.court_no)}</div>`:''}
        ${inst.notes?`<div class="sb-row" style="font-style:italic;opacity:.85">${esc(inst.notes)}</div>`:''}
        <div class="sb-resize" onmousedown="event.stopPropagation();startBlockResize(event,${inst.id})" ontouchstart="event.stopPropagation();startBlockResize(event,${inst.id})"></div>`;
      td.appendChild(div);
      makeBlockDraggable(div,inst.id);
    });
  });
  setupDrag();
}

function cycleW(id){
  const i=getInsts().find(x=>x.id===id);if(!i)return;
  const n=i.status==='scheduled'?'completed':i.status==='completed'?'cancelled':'scheduled';
  setInstStatus(id,n);renderWeek();
}

// ── DRAG SELECT ───────────────────────────────────────────────
let drag=null;
function setupDrag(){
  const tbody=document.getElementById('sched-body');
  tbody.onmousedown=e=>{
    const td=e.target.closest('td.tslot');if(!td)return;
    const sx=e.clientX,sy=e.clientY;
    drag={date:td.dataset.date,day:+td.dataset.day,s:+td.dataset.h,e:+td.dataset.h};
    let dragged=false;
    document.onmousemove=ev=>{
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!dragged&&Math.sqrt(dx*dx+dy*dy)<7)return;
      dragged=true;e.preventDefault();
      const el=document.elementFromPoint(ev.clientX,ev.clientY);
      const t=el?.closest('td.tslot');
      if(t&&t.dataset.date===drag.date){drag.e=+t.dataset.h;highlight();}
    };
    document.onmouseup=()=>{
      document.onmousemove=null;document.onmouseup=null;
      clearHL();
      if(drag){
        if(clip){
          pasteClipAt(drag.date,drag.day,Math.min(drag.s,drag.e));
        } else if(selectedInstId){
          deselectAll();
        } else {
          openModal(drag.date,drag.day,Math.min(drag.s,drag.e),Math.max(drag.s,drag.e)+.5);
        }
        drag=null;
      }
    };
  };
  // Touch
  tbody.ontouchstart=e=>{
    const td=e.target.closest('td.tslot');if(!td)return;
    drag={date:td.dataset.date,day:+td.dataset.day,s:+td.dataset.h,e:+td.dataset.h};
    const onMove=ev=>{
      const t=document.elementFromPoint(ev.touches[0].clientX,ev.touches[0].clientY)?.closest('td.tslot');
      if(t&&t.dataset.date===drag.date){drag.e=+t.dataset.h;}
    };
    const onEnd=()=>{
      document.removeEventListener('touchmove',onMove);
      if(drag){
        if(clip){pasteClipAt(drag.date,drag.day,Math.min(drag.s,drag.e));}
        else{openModal(drag.date,drag.day,Math.min(drag.s,drag.e),Math.max(drag.s,drag.e)+.5);}
        drag=null;
      }
    };
    document.addEventListener('touchmove',onMove,{passive:true});
    document.addEventListener('touchend',onEnd,{once:true});
  };
}

function pasteClipAt(date,day,startH){
  if(!clip)return;
  const duration=compHrs(clip.start_time,clip.end_time);
  const newStart=d2t(startH);
  const newEnd=d2t(startH+duration);
  const data={...clip,start_time:newStart,end_time:newEnd};
  const sess=saveSession({...data,recurring:0,day_of_week:null,date});
  addOneOff(sess.id,data,date);
  renderSched();
}
function highlight(){
  clearHL();
  if(!drag)return;
  const lo=Math.min(drag.s,drag.e),hi=Math.max(drag.s,drag.e);
  document.querySelectorAll(`td.tslot[data-date="${drag.date}"]`).forEach(td=>{
    const h=+td.dataset.h;if(h>=lo&&h<=hi)td.classList.add('drag-hi');
  });
}
function clearHL(){document.querySelectorAll('td.tslot.drag-hi').forEach(x=>x.classList.remove('drag-hi'))}

// ── BLOCK DRAG TO MOVE ────────────────────────────────────────
function makeBlockDraggable(div,instId){
  div.addEventListener('dblclick',e=>{
    e.stopPropagation();
    if(e.target.closest('.sb-btns')||e.target.closest('.sb-resize'))return;
    openEdit(instId);
  });
  div.addEventListener('mousedown',e=>{
    if(e.target.closest('.sb-btns')||e.target.closest('.sb-resize'))return;
    e.preventDefault();e.stopPropagation();
    selectInst(instId);
    startBlockMove(e.clientX,e.clientY,instId,false);
  });
  div.addEventListener('touchstart',e=>{
    if(e.target.closest('.sb-btns')||e.target.closest('.sb-resize'))return;
    e.stopPropagation();
    selectInst(instId);
    startBlockMove(e.touches[0].clientX,e.touches[0].clientY,instId,true);
  },{passive:false});
}

function startBlockMove(startX,startY,instId,isTouch){
  const inst=getInsts().find(x=>x.id===instId);if(!inst)return;
  const duration=compHrs(inst.start_time,inst.end_time);
  const origEl=document.querySelector(`[data-inst-id="${instId}"]`);if(!origEl)return;
  const rect=origEl.getBoundingClientRect();
  let ghost=null,hasMoved=false;
  let targetDate=inst.date,targetH=t2d(inst.start_time),lastTd=null;
  function onMove(cx,cy){
    const dx=cx-startX,dy=cy-startY;
    if(!hasMoved){
      if(Math.sqrt(dx*dx+dy*dy)<9)return; // threshold: 9px before drag activates
      hasMoved=true;
      ghost=origEl.cloneNode(true);
      ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;opacity:.65;pointer-events:none;z-index:1000;border-radius:6px;transition:none`;
      document.body.appendChild(ghost);
      origEl.classList.add('dragging');
    }
    ghost.style.left=(rect.left+dx)+'px';
    ghost.style.top=(rect.top+dy)+'px';
    ghost.style.display='none';
    const el=document.elementFromPoint(cx,cy);
    ghost.style.display='';
    const td=el?.closest('td.tslot');
    if(td){
      if(lastTd)lastTd.classList.remove('drag-hi');
      td.classList.add('drag-hi');lastTd=td;
      targetDate=td.dataset.date;targetH=+td.dataset.h;
    }
  }
  function onUp(){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
    document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',tu);
    if(ghost)document.body.removeChild(ghost);
    origEl.classList.remove('dragging');
    if(lastTd)lastTd.classList.remove('drag-hi');
    if(hasMoved){
      const newEndH=targetH+duration;
      if(newEndH<=22.5)updateInst(instId,{...inst,date:targetDate,start_time:d2t(targetH),end_time:d2t(newEndH)});
      renderWeek();
    }
  }
  const mm=e=>onMove(e.clientX,e.clientY);
  const mu=()=>onUp();
  const tm=e=>{e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);};
  const tu=()=>onUp();
  if(isTouch){document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',tu,{once:true});}
  else{document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu,{once:true});}
}

// ── BLOCK RESIZE ─────────────────────────────────────────────
function startBlockResize(e,instId){
  const isTouch=e.touches!=null;
  const startY=isTouch?e.touches[0].clientY:e.clientY;
  const inst=getInsts().find(x=>x.id===instId);if(!inst)return;
  const origEl=document.querySelector(`[data-inst-id="${instId}"]`);if(!origEl)return;
  const origEndH=t2d(inst.end_time);
  const origH=parseInt(origEl.style.height)||0;
  function onMove(cy){
    const dy=cy-startY;
    const deltaSlots=Math.round(dy/SLOT_H);
    const newEndH=Math.max(t2d(inst.start_time)+0.5,Math.min(22.5,origEndH+deltaSlots*0.5));
    const startSlot=(t2d(inst.start_time)-6)*2;
    const endSlot=(newEndH-6)*2;
    origEl.style.height=Math.max(SLOT_H-2,(endSlot-startSlot)*SLOT_H-2)+'px';
    origEl._newEndH=newEndH;
  }
  function onUp(){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
    document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',tu);
    if(origEl._newEndH!==undefined){
      updateInst(instId,{...inst,end_time:d2t(origEl._newEndH)});
      delete origEl._newEndH;
    }
    renderWeek();
  }
  const mm=e=>onMove(e.clientY);
  const mu=()=>onUp();
  const tm=e=>{e.preventDefault();onMove(e.touches[0].clientY);};
  const tu=()=>onUp();
  if(isTouch){document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',tu,{once:true});}
  else{document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu,{once:true});}
}

let calDate=new Date();
function shiftMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderMonth()}

function renderMonth(){
  renderLegend('legend-m');
  const yr=calDate.getFullYear(),mo=calDate.getMonth();
  document.getElementById('month-lbl').textContent=`${MONTHS[mo]} ${yr}`;
  const first=new Date(yr,mo,1).getDay();
  const dim=new Date(yr,mo+1,0).getDate();
  const today=ds(new Date());
  const allI=getInsts();
  document.getElementById('cal-dows').innerHTML=DAYS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const total=Math.ceil((first+dim)/7)*7;
  let html='';
  for(let i=0;i<total;i++){
    const dayN=i-first+1;
    const inMo=dayN>=1&&dayN<=dim;
    const d=inMo?new Date(yr,mo,dayN):null;
    const dt=d?ds(d):'';
    const isTdy=dt===today;
    const di=inMo?allI.filter(x=>x.date===dt).sort((a,b)=>a.start_time.localeCompare(b.start_time)):[];
    html+=`<div class="cal-cell${!inMo?' other':''}${isTdy?' today':''}" data-date="${dt}">
      <div class="cal-num" onclick="${inMo?`openDay('${dt}',${d?.getDay()||0})`:''}">${inMo?dayN:''}</div>
      ${di.map(inst=>{
        const color=getBlockColor(inst);
        const tc=txColor(color);
        const cn=coachNames(inst.coach_ids);
        const noColor2=!color||color==='';
        const chipBg=noColor2?'rgba(0,0,0,0.05)':color;
        const chipBorder=noColor2?'2px dashed var(--bdr)':color==='#ffffff'?'1px solid #d1d5db':'1px solid rgba(0,0,0,.18)';
        const chipTc=noColor2?'var(--tx)':tc;
        return`<div class="cal-chip" data-inst-id="${inst.id}" style="background:${chipBg};color:${chipTc};border:${chipBorder}">
          <div class="cal-chip-venue">${esc(inst.venue_text||'')}${inst.court_no?' · Ct '+esc(inst.court_no):''}</div>
          ${inst.class_type||inst.standard?`<div class="cal-chip-sub">${esc([inst.class_type,inst.standard].filter(Boolean).join(' · '))}</div>`:''}
          <div class="cal-chip-sub">${fmt12(inst.start_time)}–${fmt12(inst.end_time)}${cn?' · '+esc(cn):''}</div>
          ${inst.notes?`<div class="cal-chip-sub" style="font-style:italic">${esc(inst.notes)}</div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }
  const grid=document.getElementById('cal-grid');
  grid.innerHTML=html;
  setupCalChipDrag(grid);
}

function setupCalChipDrag(grid){
  grid.addEventListener('mousedown',startCalDrag);
  grid.addEventListener('touchstart',startCalDrag,{passive:false});
}

function startCalDrag(e){
  const chip=e.target.closest('.cal-chip[data-inst-id]');
  if(!chip)return;
  const isTouch=e.touches!=null;
  const startX=isTouch?e.touches[0].clientX:e.clientX;
  const startY=isTouch?e.touches[0].clientY:e.clientY;
  const instId=+chip.dataset.instId;
  const inst=getInsts().find(x=>x.id===instId);if(!inst)return;
  const rect=chip.getBoundingClientRect();
  // ghost
  const ghost=chip.cloneNode(true);
  ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;opacity:.75;pointer-events:none;z-index:1000;border-radius:4px;`;
  document.body.appendChild(ghost);
  chip.style.opacity='0.3';
  let lastCell=null,targetDate=inst.date;
  function onMove(cx,cy){
    ghost.style.left=(rect.left+cx-startX)+'px';
    ghost.style.top=(rect.top+cy-startY)+'px';
    ghost.style.display='none';
    const el=document.elementFromPoint(cx,cy);
    ghost.style.display='';
    const cell=el?.closest('.cal-cell:not(.other)');
    if(cell){
      if(lastCell&&lastCell!==cell)lastCell.classList.remove('drop-target');
      cell.classList.add('drop-target');lastCell=cell;
      targetDate=cell.dataset.date||targetDate;
    }
  }
  function onUp(){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
    document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',tu);
    document.body.removeChild(ghost);
    if(lastCell)lastCell.classList.remove('drop-target');
    if(targetDate&&targetDate!==inst.date){
      updateInst(instId,{...inst,date:targetDate});
    }
    renderMonth();
  }
  const mm=e=>onMove(e.clientX,e.clientY);
  const mu=()=>onUp();
  const tm=e=>{e.preventDefault();onMove(e.touches[0].clientX,e.touches[0].clientY);};
  const tu=()=>onUp();
  if(isTouch){document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',tu,{once:true});}
  else{document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu,{once:true});}
  e.preventDefault();e.stopPropagation();
}

function submitSession(){
  const coach_ids=[...selCoachIds];
  const color=document.getElementById('m-color').value;
  const venue_text=document.getElementById('m-venue').value.trim();
  const class_type=document.getElementById('m-class').value.trim();
  const standard=document.getElementById('m-std').value.trim();
  const court_no=document.getElementById('m-court').value.trim();
  const notes=document.getElementById('m-notes').value.trim();
  const start_time=document.getElementById('m-start').value;
  const end_time=document.getElementById('m-end').value;
  const rec=document.getElementById('m-rec').value==='1';
  if(!start_time||!end_time){alert('Set start and end time.');return}
  if(start_time>=end_time){alert('End must be after start.');return}
  if(venue_text){const l=getVenues();if(!l.includes(venue_text)){l.push(venue_text);S.set('venues',l);}}
  const data={coach_ids,color,venue_text,class_type,standard,court_no,notes,start_time,end_time};
  if(editId){

  } else {
    const sess=saveSession({...data,recurring:rec?1:0,day_of_week:rec?mDay:null,date:rec?null:mDate});

  for(let mask=1;mask<(1<<coaches.length);mask++){
    const combo=coaches.filter((_,i)=>(mask&(1<<i))!==0);
    if(combo.length<2)continue;
    combos.push(combo);
  }
  if(!combos.length){
    document.getElementById('combo-colors').innerHTML='<div class="empty" style="padding:8px 0">Need 2+ coaches for combos.</div>';
    return;
  }
  const COMBO_COLORS=['#ef4444','#f97316','#facc15','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#f472b6','#ffffff',''];
  html=combos.map(combo=>{
    const ids=combo.map(c=>c.id);
    const key=getComboKey(ids);
    const cc=getComboColors();
    const color=cc[key]!==undefined?cc[key]:'#3b82f6';
    const names=combo.map(c=>c.name).join(' + ');
    return`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bdr)">
      <div style="flex:1;font-size:12px;font-weight:600">${esc(names)}</div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px">
        ${COMBO_COLORS.map(c=>{
          const isSel=color===c;
          const isNone=c==='';
          const isWhite=c==='#ffffff';
          const bg=isNone?'background:rgba(255,255,255,.7);background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0,rgba(0,0,0,.18) 2px,transparent 2px,transparent 8px)':`background:${c}`;
          const bdr=isSel?'border:2px solid #000':isWhite?'border:1px solid #d1d5db':'border:1px solid rgba(0,0,0,.2)';
          return`<button type="button" style="width:22px;height:22px;border-radius:4px;${bg};${bdr};cursor:pointer" onclick="saveComboColor('${key}','${c}');renderComboColors()"></button>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  document.getElementById('combo-colors').innerHTML=html;
}

// ── TRACKER ───────────────────────────────────────────────────
function curMonth(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function mLabel(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('default',{month:'long',year:'numeric'})}
let trackerMonth=curMonth();

function renderTracker(){
  const sel=document.getElementById('tracker-month');
  if(!sel.innerHTML){
    sel.innerHTML=Array.from({length:15},(_,i)=>{
      const d=new Date();d.setMonth(d.getMonth()-12+i);
      const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      return`<option value="${ym}">${mLabel(ym)}</option>`;
    }).join('');
  }
  sel.value=trackerMonth;
  const coaches=getCoaches();
  const mI=getInsts().filter(i=>i.date.startsWith(trackerMonth));
  const cards=coaches.map(c=>{
    const ci=mI.filter(i=>i.coach_ids&&i.coach_ids.includes(c.id));
    const active=ci.filter(i=>i.status!=='cancelled');
    const hrs=active.reduce((a,i)=>a+i.hours,0);
    return{c,hrs,total:ci.length,done:ci.filter(i=>i.status==='completed').length};
  }).filter(x=>x.total>0);
  if(!cards.length){
    document.getElementById('tracker-content').innerHTML=`<div class="card"><div class="empty">No sessions for ${mLabel(trackerMonth)}.</div></div>`;
    return;
  }
  document.getElementById('tracker-content').innerHTML=`
    <p style="font-size:12px;color:var(--txm);margin-bottom:12px">${mLabel(trackerMonth)}</p>
    <div class="tgrid">
      ${cards.map(x=>{
        const color=x.c.color||'#3b82f6';
        return`<div class="tcard" style="border-color:${color};background:${color}1a">
          <div class="tc-name" style="color:${color}">${esc(x.c.name)}</div>
          <div class="tc-hrs">${x.hrs.toFixed(1)}</div>
          <div class="tc-lbl">hours</div>
          <div class="tc-sub">${x.total} session${x.total!==1?'s':''} · ${x.done} done</div>
        </div>`;
      }).join('')}
    </div>`;
}

// ── COLLAPSIBLE CARDS ─────────────────────────────────────────
function toggleCard(bodyId,chevId){
  const body=document.getElementById(bodyId);
  const hidden=body.style.display==='none';
  body.style.display=hidden?'':'none';
  const ch=document.getElementById(chevId);
  if(ch)ch.textContent=hidden?'▼':'▶';
}
